                ⚡ ${t.realityLabel}
              </span>
              <p class="text-[11px] text-slate-300 font-medium leading-relaxed">
                ${item.reality[currentLang]}
              </p>
            </div>

            <!-- Antidote (Core Lesson) -->
            <div class="bg-white/5 border border-white/10 rounded-xl p-2.5 flex items-start gap-2">
              <span class="text-xs mt-0.5">💡</span>
              <p class="text-[11px] font-bold text-slate-200 leading-relaxed">
                <strong class="text-amber-300 mr-1">${t.antidoteLabel}:</strong> ${item.antidote[currentLang]}
              </p>
            </div>
          </div>

          <!-- Bottom Voting Pill (Interactive Feedback) -->
          <div class="pt-2 flex items-center justify-between gap-2 border-t border-slate-800/60">
            <button onclick="castVote('${item.id}', 'fail')" class="flex-1 py-2 rounded-xl text-[11px] font-black flex items-center justify-center gap-1 border transition active:scale-95 ${userVoted === 'fail' ? 'bg-rose-500 border-rose-400 text-white shadow-md shadow-rose-500/30' : 'bg-[#0b0e14] border-slate-800 text-slate-300 hover:border-slate-700'}">
              <span>${t.btnFail}</span>
              <span class="font-mono text-[10px] opacity-80">${item.upvotes + (userVoted === 'fail' ? 1 : 0)}</span>
            </button>
            <button onclick="castVote('${item.id}', 'pass')" class="flex-1 py-2 rounded-xl text-[11px] font-black flex items-center justify-center gap-1 border transition active:scale-95 ${userVoted === 'pass' ? 'bg-slate-700 border-slate-600 text-white' : 'bg-[#0b0e14] border-slate-800 text-slate-400 hover:border-slate-700'}">
              <span>${t.btnPass}</span>
              <span class="font-mono text-[10px] opacity-80">${item.disagrees + (userVoted === 'pass' ? 1 : 0)}</span>
            </button>
          </div>
        `;
        track.appendChild(card);
      });

      // 스크롤 시 상단 인디케이터 인덱스 실시간 갱신
      track.addEventListener('scroll', () => {
        const cardWidth = track.firstElementChild?.offsetWidth || 300;
        const activeIdx = Math.round(track.scrollLeft / cardWidth) + 1;
        const total = filtered.length;
        document.getElementById('indicator-text').innerText = `${Math.min(activeIdx, total)} of ${total} ${t.caseWord.toUpperCase()}`;
      }, { passive: true });
    }

    function castVote(id, type) {
      const votedKey = `swipe_voted_${id}`;
      const prev = localStorage.getItem(votedKey);
      if (prev) {
        alert(currentLang === 'ko' ? "이미 투표에 참여하셨습니다!" : "You have already voted!");
        return;
      }
      localStorage.setItem(votedKey, type);
      renderCarousel(currentFilter);
    }

    function filterFeed(type) {
      currentFilter = type;
      document.querySelectorAll('.era-tab').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "era-tab active text-white bg-slate-800 px-2.5 py-1 rounded-xl transition font-black";
        } else {
          btn.className = "era-tab text-slate-400 px-2.5 py-1 rounded-xl hover:text-white transition font-medium";
        }
      });
      renderCarousel(type);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('swipe_lang', lang);
      document.documentElement.lang = lang;
      updateUiLabels();
      renderCarousel(currentFilter);
    }

    const savedLang = localStorage.getItem('swipe_lang');
    if (savedLang) {
      currentLang = savedLang;
    } else if (!navigator.language.startsWith('ko')) {
      currentLang = 'en';
    }

    document.documentElement.lang = currentLang;
    updateUiLabels();
    renderCarousel();
  </script>
</body>
</html>
