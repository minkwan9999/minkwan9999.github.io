<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인사이트랩 - 상해버린 예측들 (Aged Like Milk)</title>
  <meta name="description" content="산업혁명부터 닷컴, 스마트폰, AI 시대까지. 당대 최고 권위자들의 호언장담과 N년 뒤 참교육 성적표를 사진과 함께 박제합니다.">
  <meta property="og:title" content="인사이트랩: 상해버린 예측들">
  <meta property="og:description" content="사진으로 보는 과거 대가들의 오판 vs 냉정한 현실 성적표">
  <script src="https://cdn.tailwindcss.com"></script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q543DWEBBW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-Q543DWEBBW');
</script>
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=pub-1957248819245044" crossorigin="anonymous"></script>

</head>
<body class="bg-[#0e1117] text-slate-200 antialiased min-h-screen py-5 px-3 flex flex-col items-center selection:bg-orange-500 selection:text-white">

  <main class="w-full max-w-md space-y-4">
    <!-- 상단 헤더 -->
    <header class="bg-[#161b22] border border-slate-800 rounded-2xl p-3.5 shadow-lg space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center font-black text-white text-sm shadow shrink-0">
            🥛
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold text-white text-sm tracking-tight truncate" id="ui-subname">상해버린 예측들</span>
              <span class="text-[10px] bg-orange-500/20 text-orange-400 font-bold px-1.5 py-0.5 rounded border border-orange-500/30 shrink-0" id="ui-subtag">성지순례</span>
            </div>
            <p class="text-[11px] text-slate-400 truncate" id="ui-subtitle">대가의 오판 교훈 & 빅마우스 성적표</p>
          </div>
        </div>

        <!-- 언어 토글 & 홈 링크 -->
        <div class="flex items-center gap-1.5 shrink-0">
          <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg p-0.5 text-[11px] font-bold">
            <button onclick="setLang('ko')" id="btn-ko" class="px-2 py-0.5 rounded bg-orange-500 text-white transition">KO</button>
            <button onclick="setLang('en')" id="btn-en" class="px-2 py-0.5 rounded text-slate-400 hover:text-white transition">EN</button>
          </div>
          <a href="/" class="text-xs text-slate-400 hover:text-white px-1 whitespace-nowrap transition" id="ui-home">홈</a>
        </div>
      </div>

      <!-- 4개 카테고리 필터 버튼 바 -->
      <div class="flex items-center gap-1.5 pt-2 border-t border-slate-800/80 text-xs font-semibold overflow-x-auto whitespace-nowrap">
        <button onclick="filterType('ALL')" class="filter-btn active px-3 py-1 rounded-lg bg-orange-500 text-white transition" data-type="ALL" id="filter-all">전체 피드</button>
        <button onclick="filterType('LESSON')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="LESSON" id="filter-lesson">참교육</button>
        <button onclick="filterType('TRACK')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="TRACK" id="filter-track">성적표</button>
        <button onclick="filterType('ONGOING')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="ONGOING" id="filter-ongoing">최신발언</button>
      </div>
    </header>

    <!-- 피드 리스트 컨테이너 -->
    <div id="feed-container" class="space-y-4">
      <p class="text-center text-slate-500 py-10 text-sm">불러오는 중...</p>
    </div>

    <!-- 하단 푸터 -->
    <footer class="pt-4 pb-6 text-center text-xs text-slate-500 space-y-1">
      <p id="ui-footer-note">역사적 문헌 아카이브, 보도 사진 및 시장 지표를 기반으로 기록되었습니다.</p>
      <p>© 2026 인사이트랩 (InsightLab) · Aged Like Milk Edition</p>
    </footer>
  </main>

  <script>
    let currentLang = 'ko';
    let currentFilter = 'ALL';
    let POSTS = [];
    let expandedId = null;

    const NEW_BADGE_DAYS = 3;
    function isNewItem(item) {
      if (!item.addedAt) return false;
      const addedMs = new Date(item.addedAt).getTime();
      if (isNaN(addedMs)) return false;
      const daysSince = (Date.now() - addedMs) / 86400000;
      return daysSince >= 0 && daysSince <= NEW_BADGE_DAYS;
    }

    function getOutcomeBadge(item, t) {
      if (item.cardType === 'ONGOING') {
        return { label: t.badgeOngoing, colorClass: 'bg-amber-500/10 text-amber-300 border-amber-500/30' };
      }
      const isCorrect = /emerald|cyan/.test(item.statusColor || '');
      return isCorrect
        ? { label: t.badgeCorrect, colorClass: 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30' }
        : { label: t.badgeWrong, colorClass: 'bg-rose-500/10 text-rose-300 border-rose-500/30' };
    }

    const I18N = {
      ko: {
        subname: "상해버린 예측들",
        subtag: "성지순례",
        subtitle: "대가의 오판 교훈 & 빅마우스 성적표",
        home: "홈",
        filterAll: "전체 피드",
        filterLesson: "참교육",
        filterTrack: "성적표",
        filterOngoing: "최신발언",
        tagLesson: "🏛️ 역사의 참교육",
        tagTrack: "📈 빅마우스 성적표",
        tagOngoing: "⏳ 현재 진행형 예측",
        quoteLabel: "📌 당시 발언",
        historyTitle: "⚖️ 역사의 실제 판결",
        marketTitle: "📊 실제 시장 성적표",
        ongoingTitle: "⏳ 현재 진행 상황",
        takeawayLesson: "💡 우리가 배울 점:",
        takeawayTrack: "💡 복기 인사이트:",
        takeawayOngoing: "💡 관전 포인트:",
        voteFail: "🔥 역대급 헛소리",
        votePass: "🤔 이번엔 진짜다",
        votedBadge: "성지순례 완료",
        newBadge: "NEW",
        badgeWrong: "예측 틀림 ✗",
        badgeCorrect: "예측 맞음 ✓",
        badgeOngoing: "진행중 ⏳",
        predictionLabel: "예측:",
        nowLabel: "지금은:",
        loadError: "데이터를 불러오지 못했습니다.",
        footerNote: "역사적 문헌 아카이브, 보도 사진 및 시장 지표를 기반으로 기록되었습니다."
      },
      en: {
        subname: "Aged Like Milk",
        subtag: "RealityCheck",
        subtitle: "Historic blunders & big-mouth track records",
        home: "Home",
        filterAll: "All Feeds",
        filterLesson: "Blunders",
        filterTrack: "Track Record",
        filterOngoing: "Latest Bets",
        tagLesson: "🏛️ Historic Blunder",
        tagTrack: "📈 Track Record",
        tagOngoing: "⏳ Ongoing Bet",
        quoteLabel: "📌 Recorded Quote",
        historyTitle: "⚖️ Verdict of History",
        marketTitle: "📊 Real Market Outcome",
        ongoingTitle: "⏳ Current Status",
        takeawayLesson: "💡 Takeaway Lesson:",
        takeawayTrack: "💡 Retrospective Insight:",
        takeawayOngoing: "💡 Key Watchpoint:",
        voteFail: "🔥 Aged Like Milk",
        votePass: "🤔 Might Be Right",
        votedBadge: "Verified",
        newBadge: "NEW",
        badgeWrong: "Wrong Prediction ✗",
        badgeCorrect: "Correct Prediction ✓",
        badgeOngoing: "In Progress ⏳",
        predictionLabel: "Prediction:",
        nowLabel: "Now:",
        loadError: "Failed to load data.",
        footerNote: "Documented based on historical photo archives, news records, and market data."
      }
    };

    function updateUiLabels() {
      const t = I18N[currentLang];
      document.getElementById('ui-subname').innerText = t.subname;
      document.getElementById('ui-subtag').innerText = t.subtag;
      document.getElementById('ui-subtitle').innerText = t.subtitle;
      document.getElementById('ui-home').innerText = t.home;
      document.getElementById('filter-all').innerText = t.filterAll;
      document.getElementById('filter-lesson').innerText = t.filterLesson;
      document.getElementById('filter-track').innerText = t.filterTrack;
      document.getElementById('filter-ongoing').innerText = t.filterOngoing;
      document.getElementById('ui-footer-note').innerText = t.footerNote;

      const btnKo = document.getElementById('btn-ko');
      const btnEn = document.getElementById('btn-en');
      if (currentLang === 'ko') {
        btnKo.className = "px-2 py-0.5 rounded bg-orange-500 text-white transition";
        btnEn.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      } else {
        btnEn.className = "px-2 py-0.5 rounded bg-orange-500 text-white transition";
        btnKo.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      }
    }

    function toggleExpand(id) {
      expandedId = expandedId === id ? null : id;
      renderFeed(currentFilter);
    }

    function renderFeed(filter = 'ALL') {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';
      const t = I18N[currentLang];

      const filtered = filter === 'ALL' ? POSTS : POSTS.filter(item => item.cardType === filter);

      filtered.forEach(item => {
        const isExpanded = expandedId === item.id;
        const isNew = isNewItem(item);

        let typeHeaderTag = '';
        let outcomeTitle = '';
        let takeawayTitle = '';

        if (item.cardType === 'LESSON') {
          typeHeaderTag = `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/10 text-amber-300 border border-amber-500/30">${t.tagLesson}</span>`;
          outcomeTitle = t.historyTitle;
          takeawayTitle = t.takeawayLesson;
        } else if (item.cardType === 'TRACK') {
          typeHeaderTag = `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-500/10 text-blue-300 border border-blue-500/30">${t.tagTrack}</span>`;
          outcomeTitle = t.marketTitle;
          takeawayTitle = t.takeawayTrack;
        } else {
          typeHeaderTag = `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-300 border border-emerald-500/30">${t.tagOngoing}</span>`;
          outcomeTitle = t.ongoingTitle;
          takeawayTitle = t.takeawayOngoing;
        }

        const outcomeBadge = getOutcomeBadge(item, t);

        const card = document.createElement('article');
        card.className = `border rounded-2xl overflow-hidden shadow-xl transition ${isExpanded ? 'bg-[#161b22] border-orange-500/50' : 'bg-[#161b22]/80 border-slate-800 hover:border-slate-700'}`;

        card.innerHTML = `
          <!-- 요약 행 (탭하면 펼쳐짐) -->
          <div onclick="toggleExpand('${item.id}')" class="p-3 flex items-center justify-between gap-2 cursor-pointer select-none">
            <div class="flex items-center gap-2 min-w-0 pr-2">
              <span class="text-lg shrink-0">${item.avatar}</span>
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="font-bold text-slate-200 text-sm truncate">${item.author[currentLang]}</span>
                  ${isNew ? `<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-rose-500 text-white shrink-0 animate-pulse">${t.newBadge}</span>` : ''}
                </div>
                <div class="text-[11px] text-slate-400 truncate">${t.predictionLabel} ${item.title[currentLang]}</div>
                <div class="text-[11px] text-orange-300/90 truncate mt-0.5">→ ${t.nowLabel} ${item.realityStat[currentLang]}</div>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded border whitespace-nowrap ${outcomeBadge.colorClass}">
                ${outcomeBadge.label}
              </span>
              <span class="text-slate-500 text-xs transition-transform duration-200 ${isExpanded ? 'rotate-180 text-orange-400' : ''}">▼</span>
            </div>
          </div>

          ${isExpanded ? `
          <div class="border-t border-slate-800/80">
            <!-- 상단 사진 -->
            <div class="relative w-full h-40 bg-slate-950 overflow-hidden border-b border-slate-800">
              <img src="${item.imageBeforeUrl}" alt="${item.author[currentLang]}" class="w-full h-full object-cover object-center filter grayscale contrast-110 hover:grayscale-0 transition duration-500" loading="lazy">
              <div class="absolute inset-0 bg-gradient-to-t from-[#161b22] via-transparent to-black/30"></div>
              <span class="absolute bottom-2 left-3 text-[10px] font-mono text-slate-300 bg-black/60 px-2 py-0.5 rounded backdrop-blur border border-white/10 truncate max-w-[85%]">
                📷 ${item.imageCaption[currentLang]}
              </span>
            </div>

            <!-- 카드 본문 -->
            <div class="p-4 space-y-3">
              <div class="flex items-center gap-1.5">
                ${typeHeaderTag}
              </div>
              <div class="text-[11px] text-slate-400">${item.authorTitle[currentLang]} · ${item.eraTag[currentLang]}</div>
              <h2 class="text-base font-extrabold text-white leading-snug tracking-tight">
                ${item.title[currentLang]}
              </h2>

              <!-- 발언 인용구 박스 -->
              <div class="bg-[#1c2128] border-l-4 border-amber-500/80 rounded-r-xl p-3 space-y-1 shadow-inner">
                <div class="flex items-center justify-between text-[11px] text-amber-400 font-mono font-bold whitespace-nowrap">
                  <span>${t.quoteLabel}</span>
                  <span class="text-slate-500 truncate ml-2 text-[10px]">${item.quoteSource[currentLang]}</span>
                </div>
                <p class="text-xs sm:text-sm text-slate-300 italic leading-relaxed">
                  "${item.quoteText[currentLang]}"
                </p>
              </div>

              <!-- 대비 화살표 -->
              <div class="relative flex py-0.5 items-center justify-center">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="flex-shrink mx-2 text-[10px] font-mono font-bold text-slate-400 bg-[#161b22] px-2 py-0.5 rounded border border-slate-800 whitespace-nowrap">
                  ${item.timelineLabel[currentLang]}
                </span>
                <div class="flex-grow border-t border-slate-800"></div>
              </div>

              <!-- 결과 박스 -->
              <div class="bg-[#0e1117] border border-slate-800 rounded-xl p-3 space-y-1">
                <div class="flex items-center justify-between text-[11px] font-bold text-emerald-400 whitespace-nowrap">
                  <span>${outcomeTitle}</span>
                  <span class="text-[10px] text-slate-400 font-mono truncate ml-2">${item.realityStat[currentLang]}</span>
                </div>
                <p class="text-xs text-slate-300 leading-relaxed font-medium">
                  ${item.realityText[currentLang]}
                </p>
              </div>

              <!-- 실전 교훈 박스 -->
              <div class="bg-gradient-to-r from-orange-950/20 to-amber-950/10 border border-orange-500/20 rounded-xl p-2.5">
                <p class="text-xs text-orange-200/90 leading-relaxed">
                  <strong class="text-orange-400 font-extrabold mr-1 whitespace-nowrap">${takeawayTitle}</strong>${item.actionHighlight[currentLang]}
                </p>
              </div>
            </div>
          </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    function filterType(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "filter-btn active px-3 py-1 rounded-lg bg-orange-500 text-white font-bold transition";
        } else {
          btn.className = "filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
        }
      });
      renderFeed(type);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('user_lang', lang);
      document.documentElement.lang = lang;
      updateUiLabels();
      renderFeed(currentFilter);
    }

    const savedLang = localStorage.getItem('user_lang');
    if (savedLang) {
      currentLang = savedLang;
    } else if (!navigator.language.startsWith('ko')) {
      currentLang = 'en';
    }

    document.documentElement.lang = currentLang;
    updateUiLabels();

    fetch('./posts.json')
      .then(res => res.json())
      .then(data => {
        POSTS = [...(data.posts || [])].reverse();
        renderFeed(currentFilter);
      })
      .catch(err => {
        console.error('Failed to load posts.json', err);
        const c = document.getElementById('feed-container');
        if (c) c.innerHTML = `<p class="text-center text-slate-500 py-10">${I18N[currentLang].loadError}</p>`;
      });
  </script>
</body>
</html>
