          en: "End-to-end neural network driving has leaped, but state regulatory approvals and pure-vision debates remain contentious."
        },
        actionHighlight: {
          ko: "머스크의 시간표는 늘 2~3년 지연되지만 결국 기술적 임계점을 뚫어내는 패턴이 반복되었습니다. '완전 사기'로 치부할지 '지연된 혁신'으로 볼지가 투자의 핵심 갈림길입니다.",

        },
        upvotes: 489,
        disagrees: 172
      },
      // 6. 젠슨 황 코딩 종말론 (최신발언)
      {
        id: "p6",
        cardType: "ONGOING",
        eraTag: { ko: "2024~2026 · AI 에이전트 혁명", en: "2024-2026 · Agentic AI" },
        statusBadge: { ko: "판결 진행중 ⏳", en: "In Progress ⏳" },
        statusColor: "bg-amber-500/10 text-amber-400 border-amber-500/20",
        author: { ko: "젠슨 황", en: "Jensen Huang" },
        authorTitle: { ko: "엔비디아 CEO", en: "CEO of NVIDIA" },
        avatar: "⚡",
        imageBeforeUrl: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=800&auto=format&fit=crop&q=80",
        imageCaption: { ko: "AI 코드 생성 및 시스템 엔지니어링", en: "AI code generation & systems" },
        title: {
          ko: "더 이상 코딩을 배울 필요 없다. 모든 아이에게 컴퓨터 대신 다른 걸 가르쳐라",
          en: "Nobody has to learn to code. Our job is to create computing that speaks human"
        },
        quoteSource: { ko: "세계정부정상회의(WGS) 기조연설", en: "World Government Summit Keynote" },
        quoteText: {

          en: "Over the last 10-15 years, almost everybody told you that your kids must learn to code. It's completely the opposite now. The programming language is human."
        },
        timelineLabel: { ko: "⏳ 2026년 실시간 검증 중", en: "⏳ Real-Time Tracker 2026" },
        realityStat: { ko: "AI 코딩 도구 보편화 vs 시스템 아키텍처 역량 격차", en: "AI Coding Proliferation vs System Architecture Depth" },
        realityText: {
          ko: "초급 코딩과 보일러플레이트 작성은 AI 에이전트가 완벽히 대체하고 있으나, 복잡한 대규모 분산 아키텍처 설계와 장애 디버깅에서는 여전히 엔지니어링 역량이 기업의 핵심 병목으로 남아 있습니다.",

        actionHighlight: {

          en: "Syntax memorizers will diminish, but architects who frame root problems and orchestrate AI systems will command unprecedented leverage."
        },
        upvotes: 563,
        disagrees: 145
      }
    ];

    function updateUiLabels() {
      const t = I18N[currentLang];
      document.getElementById('ui-subname').innerText = t.subname;
      document.getElementById('ui-subtag').innerText = t.subtag;
      document.getElementById('ui-subtitle').innerText = t.subtitle;
      document.getElementById('ui-home').innerText = t.home;
      document.getElementById('filter-all').innerText = t.filterAll;
      document.getElementById('filter-lesson').innerText = t.filterLesson;
      document.getElementById('filter-track').innerText = t.filterTrack;
      document.getElementById('filter-ongoing').innerText = t.filterOngoing;
      document.getElementById('ui-footer-note').innerText = t.footerNote;

      const btnKo = document.getElementById('btn-ko');
      const btnEn = document.getElementById('btn-en');
      if (currentLang === 'ko') {
        btnKo.className = "px-2 py-0.5 rounded bg-orange-500 text-white transition";
        btnEn.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      } else {
        btnEn.className = "px-2 py-0.5 rounded bg-orange-500 text-white transition";
        btnKo.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      }
    }

    function renderFeed(filter = 'ALL') {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';
      const t = I18N[currentLang];

      const filtered = filter === 'ALL' ? POSTS : POSTS.filter(item => item.cardType === filter);

      filtered.forEach(item => {
        const votedKey = `voted_${item.id}`;
        const userVoted = localStorage.getItem(votedKey);

        let typeHeaderTag = '';
        let outcomeTitle = '';
        let takeawayTitle = '';

        if (item.cardType === 'LESSON') {
          typeHeaderTag = `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/10 text-amber-300 border border-amber-500/30">${t.tagLesson}</span>`;
          outcomeTitle = t.historyTitle;
          takeawayTitle = t.takeawayLesson;
        } else if (item.cardType === 'TRACK') {
          typeHeaderTag = `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-500/10 text-blue-300 border border-blue-500/30">${t.tagTrack}</span>`;
          outcomeTitle = t.marketTitle;
          takeawayTitle = t.takeawayTrack;
        } else {
          typeHeaderTag = `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-300 border border-emerald-500/30">${t.tagOngoing}</span>`;
          outcomeTitle = t.ongoingTitle;
          takeawayTitle = t.takeawayOngoing;
        }

        const card = document.createElement('article');
        card.className = "bg-[#161b22] border border-slate-800 rounded-2xl overflow-hidden shadow-xl";

        card.innerHTML = `
          <!-- 1. 헤더 -->
          <div class="p-3 pb-2.5 flex items-start justify-between border-b border-slate-800/60 bg-slate-900/40 text-xs gap-2">
            <div class="flex items-start gap-1.5 flex-1 min-w-0">
              <span class="text-base shrink-0 mt-0.5">${item.avatar}</span>
              <div class="leading-tight">
                <span class="font-bold text-slate-200">${item.author[currentLang]}</span>
                <span class="text-[11px] text-slate-400 inline-block">· ${item.authorTitle[currentLang]}</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0 whitespace-nowrap pt-0.5">
              ${typeHeaderTag}
              <span class="text-[10px] font-mono text-slate-400">${item.eraTag[currentLang]}</span>
            </div>
          </div>

          <!-- 2. 상단 사진 아카이브 (100% 검증 CDN) -->
          <div class="relative w-full h-40 bg-slate-950 overflow-hidden border-b border-slate-800">
            <img src="${item.imageBeforeUrl}" alt="${item.author[currentLang]}" class="w-full h-full object-cover object-center filter grayscale contrast-110 hover:grayscale-0 transition duration-500" loading="lazy" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=800&auto=format&fit=crop&q=80';">
            <div class="absolute inset-0 bg-gradient-to-t from-[#161b22] via-transparent to-black/30"></div>
            <span class="absolute bottom-2 left-3 text-[10px] font-mono text-slate-300 bg-black/60 px-2 py-0.5 rounded backdrop-blur border border-white/10 truncate max-w-[85%]">
              📷 ${item.imageCaption[currentLang]}
            </span>
          </div>

          <!-- 3. 카드 본문 -->
          <div class="p-4 space-y-3">
            <div class="flex items-start justify-between gap-2">
              <h2 class="text-base font-extrabold text-white leading-snug tracking-tight">
                ${item.title[currentLang]}
              </h2>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded whitespace-nowrap border shrink-0 ${item.statusColor}">
                ${item.statusBadge[currentLang]}
              </span>
            </div>

            <!-- 발언 인용구 박스 -->
            <div class="bg-[#1c2128] border-l-4 border-amber-500/80 rounded-r-xl p-3 space-y-1 shadow-inner">
              <div class="flex items-center justify-between text-[11px] text-amber-400 font-mono font-bold whitespace-nowrap">
                <span>${t.quoteLabel}</span>
                <span class="text-slate-500 truncate ml-2 text-[10px]">${item.quoteSource[currentLang]}</span>
              </div>
              <p class="text-xs sm:text-sm text-slate-300 italic leading-relaxed">
                "${item.quoteText[currentLang]}"
              </p>
            </div>

            <!-- 대비 구분선 -->
            <div class="relative flex py-0.5 items-center justify-center">
              <div class="flex-grow border-t border-slate-800"></div>
              <span class="flex-shrink mx-2 text-[10px] font-mono font-bold text-slate-400 bg-[#161b22] px-2 py-0.5 rounded border border-slate-800 whitespace-nowrap">
                ${item.timelineLabel[currentLang]}
              </span>
              <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <!-- 결과 박스 -->
            <div class="bg-[#0e1117] border border-slate-800 rounded-xl p-3 space-y-1">
              <div class="flex items-center justify-between text-[11px] font-bold text-emerald-400 whitespace-nowrap">
                <span>${outcomeTitle}</span>
                <span class="text-[10px] text-slate-400 font-mono truncate ml-2">${item.realityStat[currentLang]}</span>
              </div>
              <p class="text-xs text-slate-300 leading-relaxed font-medium">
                ${item.realityText[currentLang]}
              </p>
            </div>

            <!-- 실전 교훈 박스 -->
            <div class="bg-gradient-to-r from-orange-950/20 to-amber-950/10 border border-orange-500/20 rounded-xl p-2.5">
              <p class="text-xs text-orange-200/90 leading-relaxed">
                <strong class="text-orange-400 font-extrabold mr-1 whitespace-nowrap">${takeawayTitle}</strong>${item.actionHighlight[currentLang]}
              </p>
            </div>
          </div>

          <!-- 4. 토글 투표 인터랙션 바 -->
          <div class="px-4 py-2.5 bg-slate-900/60 border-t border-slate-800/80 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
              <button onclick="toggleVote('${item.id}', 'up')" class="vote-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition whitespace-nowrap ${userVoted === 'up' ? 'bg-orange-500 text-white font-bold border-orange-500 shadow-md shadow-orange-500/30' : 'bg-slate-800/80 text-slate-300 border-slate-700 hover:border-orange-500 hover:text-orange-400'}">
                <span>${t.voteFail}</span>
                <span class="font-mono font-bold">${item.upvotes + (userVoted === 'up' ? 1 : 0)}</span>
              </button>
              <button onclick="toggleVote('${item.id}', 'down')" class="vote-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition whitespace-nowrap ${userVoted === 'down' ? 'bg-slate-700 text-white font-bold border-slate-600 shadow-md' : 'bg-slate-800/80 text-slate-400 border-slate-700 hover:border-slate-500 hover:text-white'}">
                <span>${t.votePass}</span>
                <span class="font-mono">${item.disagrees + (userVoted === 'down' ? 1 : 0)}</span>
              </button>
            </div>
            <span class="text-[11px] text-slate-500 font-mono whitespace-nowrap">${userVoted ? t.votedBadge : ''}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleVote(id, type) {
      const votedKey = `voted_${id}`;
      const prev = localStorage.getItem(votedKey);

      if (prev === type) {
        localStorage.removeItem(votedKey);
      } else {
        localStorage.setItem(votedKey, type);
      }
      renderFeed(currentFilter);
    }

    function filterType(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "filter-btn active px-3 py-1 rounded-lg bg-orange-500 text-white font-bold transition";
        } else {
          btn.className = "filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
        }
      });
      renderFeed(type);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('user_lang', lang);
      document.documentElement.lang = lang;
      updateUiLabels();
      renderFeed(currentFilter);
    }

    const savedLang = localStorage.getItem('user_lang');
    if (savedLang) {
      currentLang = savedLang;
    } else if (!navigator.language.startsWith('ko')) {
      currentLang = 'en';
    }

    document.documentElement.lang = currentLang;
    updateUiLabels();
    renderFeed();
  </script>
</body>
</html>
