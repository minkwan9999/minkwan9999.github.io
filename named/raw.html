          <!-- 4. Vibrant Gradient Quote Card (Tubik Style) -->
          <div class="bg-gradient-to-br ${item.accentGradient} p-[2px] rounded-2xl shadow-lg">
            <div class="bg-[#0f131f]/95 rounded-[14px] p-3.5 space-y-1">
              <div class="flex items-center justify-between text-[10px] font-black tracking-widest text-slate-400 uppercase">
                <span>${t.quoteLabel}</span>
                <span>💬</span>
              </div>
              <p class="text-xs sm:text-sm font-bold text-slate-100 italic leading-relaxed">
                "${item.quote[currentLang]}"
              </p>
            </div>
          </div>

          <!-- 5. Reality Outcome Box -->
          <div class="bg-[#0e121c] border border-slate-800 rounded-2xl p-3.5 space-y-1">
            <span class="text-[10px] font-black text-emerald-400 uppercase tracking-wider block">
              ⚡ ${t.realityLabel}
            </span>
            <p class="text-xs text-slate-300 font-semibold leading-relaxed">
              ${item.reality[currentLang]}
            </p>
          </div>

          <!-- 6. Antidote Pill -->
          <div class="bg-white/5 border border-white/10 rounded-2xl p-3 flex items-start gap-2.5">
            <span class="text-amber-300 text-xs mt-0.5">💡</span>
            <p class="text-xs font-bold text-slate-200 leading-relaxed">
              <strong class="text-amber-300 mr-1">${t.takeawayLabel}:</strong> ${item.antidote[currentLang]}
            </p>
          </div>

          <!-- 7. Capsule Interactive Voting Bar -->
          <div class="pt-1 flex items-center justify-between gap-2">
            <button onclick="castVote('${item.id}', 'fail')" class="flex-1 py-2.5 px-3 rounded-2xl text-xs font-black flex items-center justify-center gap-1.5 border transition active:scale-95 ${userVoted === 'fail' ? 'bg-rose-500 border-rose-400 text-white shadow-lg shadow-rose-500/40' : 'bg-[#0e121c] border-slate-800 text-slate-300 hover:border-slate-700'}">
              <span>${t.voteFail}</span>
              <span class="font-mono text-[11px] opacity-80">${item.upvotes + (userVoted === 'fail' ? 1 : 0)}</span>
            </button>
            <button onclick="castVote('${item.id}', 'pass')" class="flex-1 py-2.5 px-3 rounded-2xl text-xs font-black flex items-center justify-center gap-1.5 border transition active:scale-95 ${userVoted === 'pass' ? 'bg-slate-700 border-slate-600 text-white' : 'bg-[#0e121c] border-slate-800 text-slate-400 hover:border-slate-700'}">
              <span>${t.votePass}</span>
              <span class="font-mono text-[11px] opacity-80">${item.disagrees + (userVoted === 'pass' ? 1 : 0)}</span>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function castVote(id, type) {
      const votedKey = `tubik_voted_${id}`;
      const prev = localStorage.getItem(votedKey);
      if (prev) {
        alert(currentLang === 'ko' ? "이미 투표에 참여하셨습니다!" : "You have already voted!");
        return;
      }
      localStorage.setItem(votedKey, type);
      renderFeed(currentFilter);
    }

    function filterFeed(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "filter-btn active px-4 py-2.5 rounded-2xl bg-white text-black shadow-lg transition whitespace-nowrap";
        } else {
          btn.className = "filter-btn px-4 py-2.5 rounded-2xl bg-[#171c2b] text-slate-400 border border-slate-800 hover:text-white transition whitespace-nowrap";
        }
      });
      renderFeed(type);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('tubik_lang', lang);
      document.documentElement.lang = lang;
      updateUiLabels();
      renderFeed(currentFilter);
    }

    const savedLang = localStorage.getItem('tubik_lang');
    if (savedLang) {
      currentLang = savedLang;
    } else if (!navigator.language.startsWith('ko')) {
      currentLang = 'en';
    }

    document.documentElement.lang = currentLang;
    updateUiLabels();
    renderFeed();
  </script>
</body>
</html>
