              <button onclick="castVote('${item.id}', 'down')" class="vote-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-700 hover:border-slate-500 transition ${userVoted === 'down' ? 'bg-slate-700 text-white font-bold' : 'bg-slate-800/80 text-slate-400'}">
                <span>🤔 그땐 그럴듯함</span>
                <span id="down-count-${item.id}" class="font-mono">${item.disagrees + (userVoted === 'down' ? 1 : 0)}</span>
              </button>
            </div>
            <span class="text-[11px] text-slate-500 font-mono">성지순례</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function castVote(id, type) {
      const votedKey = `voted_${id}`;
      const prev = localStorage.getItem(votedKey);
      if (prev) {
        alert("이미 이 사건에 성지순례 투표를 완료하셨습니다!");
        return;
      }
      localStorage.setItem(votedKey, type);
      renderFeed(currentFilter);
    }

    function filterType(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "filter-btn active px-3 py-1 rounded-lg bg-orange-500 text-white font-bold transition";
        } else {
          btn.className = "filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
        }
      });
      renderFeed(type);
    }

    renderFeed();
  </script>
</body>
</html>
