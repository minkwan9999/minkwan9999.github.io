        badgeText: { ko: "빅마우스 성적표 ✕", en: "Aged Like Milk ✕" },
        badgeClass: "bg-rose-500/10 text-rose-400 border-rose-500/20",
        author: { ko: "마이클 버리", en: "Michael Burry" },
        authorTitle: { ko: "영화 '빅쇼트' 실제 주인공", en: "The Real 'Big Short' Investor" },
        avatar: "📉",
        imageBeforeUrl: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=800&auto=format&fit=crop&q=80",
        imageCaption: { ko: "증권 시장 차트 및 하락세 분석", en: "Stock market chart and downturn analysis" },
        title: {
          ko: "Sell. (모든 주식을 지금 당장 팔아 치워라)",
          en: "Sell. (Liquidate all stocks right now)"
        },
        quoteSource: { ko: "X (구 Twitter) 단문 트윗 (2023.01)", en: "Official Post on X (2023.01)" },
        quoteText: {
          ko: "Sell.",
          en: "Sell."
        },
        timelineLabel: { ko: "📊 3개월 뒤 실제 성적표", en: "📊 3 Months Later" },
        realityStat: { ko: "나스닥 역사적 신고가 랠리 폭발", en: "Nasdaq hits historic all-time high rally" },
        realityText: {
          ko: "거액의 풋옵션을 매수하며 침체를 경고했으나, 빅테크의 AI 랠리가 폭발하며 역사적 신고가를 갈아치웠고 두 달 뒤 '내가 틀렸다'고 자인했습니다.",
          en: "He warned of a crash via large put options, but the tech AI rally exploded to record highs, forcing him to admit 'I was wrong' two months later."
        },
        actionHighlight: {
          ko: "거시경제 지표상 침체 신호가 명백하더라도, 새로운 기술 테마가 이끄는 시장의 유동성과 탐욕 모멘텀은 비관론자를 먼저 쓸어버립니다.",
          en: "Even with clear macroeconomic recession signals, market liquidity and greed driven by new tech themes will crush bears first."
        },
        upvotes: 410,
        disagrees: 33
      }
    ];

    function updateUiLabels() {
      const t = I18N[currentLang];
      document.getElementById('ui-subname').innerText = t.subname;
      document.getElementById('ui-subtag').innerText = t.subtag;
      document.getElementById('ui-subtitle').innerText = t.subtitle;
      document.getElementById('ui-home').innerText = t.home;
      document.getElementById('filter-all').innerText = t.filterAll;
      document.getElementById('filter-lesson').innerText = t.filterLesson;
      document.getElementById('filter-track').innerText = t.filterTrack;
      document.getElementById('ui-footer-note').innerText = t.footerNote;

      const btnKo = document.getElementById('btn-ko');
      const btnEn = document.getElementById('btn-en');
      if (currentLang === 'ko') {
        btnKo.className = "px-2 py-0.5 rounded bg-orange-500 text-white transition";
        btnEn.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      } else {
        btnEn.className = "px-2 py-0.5 rounded bg-orange-500 text-white transition";
        btnKo.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      }
    }

    function renderFeed(filter = 'ALL') {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';
      const t = I18N[currentLang];

      const filtered = filter === 'ALL' ? POSTS : POSTS.filter(item => item.cardType === filter);

      filtered.forEach(item => {
        const votedKey = `voted_${item.id}`;
        const userVoted = localStorage.getItem(votedKey);
        const isPastLesson = item.cardType === 'LESSON';

        const typeHeaderTag = isPastLesson 
          ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/10 text-amber-300 border border-amber-500/30">${t.tagLesson}</span>`
          : `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-500/10 text-blue-300 border border-blue-500/30">${t.tagTrack}</span>`;

        const card = document.createElement('article');
        card.className = "bg-[#161b22] border border-slate-800 rounded-2xl overflow-hidden shadow-xl";

        card.innerHTML = `
          <!-- 헤더: 인물 & 시대 -->
          <div class="p-3.5 pb-2.5 flex items-center justify-between border-b border-slate-800/60 bg-slate-900/40 text-xs">
            <div class="flex items-center gap-2">
              <span class="text-base">${item.avatar}</span>
              <div>
                <span class="font-bold text-slate-200">${item.author[currentLang]}</span>
                <span class="text-[11px] text-slate-400">· ${item.authorTitle[currentLang]}</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              ${typeHeaderTag}
              <span class="text-[10px] font-mono text-slate-400">${item.eraTag[currentLang]}</span>
            </div>
          </div>

          <!-- 상단 실제 사진 (Unsplash 검증 CDN + onerror 엑박 방지 Fallback) -->
          <div class="relative w-full h-44 bg-slate-950 overflow-hidden border-b border-slate-800">
            <img src="${item.imageBeforeUrl}" alt="${item.author[currentLang]}" class="w-full h-full object-cover object-center filter grayscale contrast-110 hover:grayscale-0 transition duration-500" loading="lazy" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=800&auto=format&fit=crop&q=80';">
            <div class="absolute inset-0 bg-gradient-to-t from-[#161b22] via-transparent to-black/30"></div>
            <span class="absolute bottom-2 left-3 text-[11px] font-mono text-slate-300 bg-black/60 px-2 py-0.5 rounded backdrop-blur border border-white/10">
              📷 ${item.imageCaption[currentLang]}
            </span>
          </div>

          <!-- 카드 본문 -->
          <div class="p-4 space-y-3">
            <div class="flex items-start justify-between gap-2">
              <h2 class="text-base font-extrabold text-white leading-snug tracking-tight">
                ${item.title[currentLang]}
              </h2>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded whitespace-nowrap border ${item.badgeClass}">
                ${item.badgeText[currentLang]}
              </span>
            </div>

            <!-- 발언 인용구 박스 -->
            <div class="bg-[#1c2128] border-l-4 border-amber-500/80 rounded-r-xl p-3.5 space-y-1 shadow-inner">
              <div class="flex items-center justify-between text-[11px] text-amber-400 font-mono font-bold">
                <span>${t.quoteLabel}</span>
                <span class="text-slate-500">${item.quoteSource[currentLang]}</span>
              </div>
              <p class="text-xs sm:text-sm text-slate-300 italic leading-relaxed">
                "${item.quoteText[currentLang]}"
              </p>
            </div>

            <!-- 대비 화살표 -->
            <div class="relative flex py-0.5 items-center justify-center">
              <div class="flex-grow border-t border-slate-800"></div>
              <span class="flex-shrink mx-2 text-[10px] font-mono font-bold text-slate-400 bg-[#161b22] px-2 py-0.5 rounded border border-slate-800">
                ${item.timelineLabel[currentLang]}
              </span>
              <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <!-- 하단 팩트/결과 박스 -->
            <div class="bg-[#0e1117] border border-slate-800 rounded-xl p-3.5 space-y-1.5">
              <div class="flex items-center justify-between text-[11px] font-bold text-emerald-400">
                <span>${isPastLesson ? t.historyTitle : t.marketTitle}</span>
                <span class="text-[10px] text-slate-400 font-mono">${item.realityStat[currentLang]}</span>
              </div>
              <p class="text-xs text-slate-300 leading-relaxed font-medium">
                ${item.realityText[currentLang]}
              </p>
            </div>

            <!-- 팩폭 교훈 박스 -->
            <div class="bg-gradient-to-r from-orange-950/20 to-amber-950/10 border border-orange-500/20 rounded-xl p-3">
              <p class="text-xs text-orange-200/90 leading-relaxed">
                <strong class="text-orange-400 font-extrabold mr-1">${isPastLesson ? t.takeawayLesson : t.takeawayTrack}</strong> ${item.actionHighlight[currentLang]}
              </p>
            </div>
          </div>

          <!-- 1클릭 성지순례 인터랙션 바 -->
          <div class="px-4 py-2.5 bg-slate-900/60 border-t border-slate-800/80 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
              <button onclick="castVote('${item.id}', 'up')" class="vote-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-700 hover:border-orange-500 hover:text-orange-400 transition ${userVoted === 'up' ? 'bg-orange-500 text-white font-bold border-orange-500' : 'bg-slate-800/80 text-slate-300'}">
                <span>${t.voteFail}</span>
                <span class="font-mono font-bold">${item.upvotes + (userVoted === 'up' ? 1 : 0)}</span>
              </button>
              <button onclick="castVote('${item.id}', 'down')" class="vote-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-700 hover:border-slate-500 transition ${userVoted === 'down' ? 'bg-slate-700 text-white font-bold' : 'bg-slate-800/80 text-slate-400'}">
                <span>${t.votePass}</span>
                <span class="font-mono">${item.disagrees + (userVoted === 'down' ? 1 : 0)}</span>
              </button>
            </div>
            <span class="text-[11px] text-slate-500 font-mono">${t.votedBadge}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function castVote(id, type) {
      const votedKey = `voted_${id}`;
      const prev = localStorage.getItem(votedKey);
      if (prev) {
        alert(currentLang === 'ko' ? "이미 성지순례 투표를 완료하셨습니다!" : "You have already verified this record!");
        return;
      }
      localStorage.setItem(votedKey, type);
      renderFeed(currentFilter);
    }

    function filterType(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "filter-btn active px-3 py-1 rounded-lg bg-orange-500 text-white font-bold transition";
        } else {
          btn.className = "filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
        }
      });
      renderFeed(type);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('user_lang', lang);
      document.documentElement.lang = lang;
      updateUiLabels();
      renderFeed(currentFilter);
    }

    const savedLang = localStorage.getItem('user_lang');
    if (savedLang) {
      currentLang = savedLang;
    } else if (!navigator.language.startsWith('ko')) {
      currentLang = 'en';
    }

    document.documentElement.lang = currentLang;
    updateUiLabels();
    renderFeed();
  </script>
</body>
</html>
