    function renderFeed(filter = 'ALL') {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';

      const filtered = filter === 'ALL' ? POSTS : POSTS.filter(item => item.era === filter);

      filtered.forEach(item => {
        // 로컬스토리지 기반 투표 상태 기억
        const votedKey = `voted_${item.id}`;
        const userVoted = localStorage.getItem(votedKey);

        const card = document.createElement('article');
        card.className = "bg-[#161b22] border border-slate-800 rounded-2xl overflow-hidden shadow-xl";

        card.innerHTML = `
          <!-- 1. 레딧 스타일 헤더: 서브태그 & 인물 -->
          <div class="p-3.5 pb-2 flex items-center justify-between border-b border-slate-800/60 bg-slate-900/40 text-xs">
            <div class="flex items-center gap-2">
              <span class="text-base">${item.avatar}</span>
              <div>
                <span class="font-bold text-slate-200">${item.author}</span>
                <span class="text-[11px] text-slate-400">· ${item.authorTitle}</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] font-mono text-slate-400">${item.year}</span>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-rose-500/10 text-rose-400 border border-rose-500/20">
                ${item.verdictStatus}
              </span>
            </div>
          </div>

          <!-- 2. 게시글 헤드라인 -->

            <h2 class="text-base font-extrabold text-white leading-snug tracking-tight">
              ${item.title}
            </h2>

            <!-- 상단 박제: 당시 원문 캡처 스타일 (빛바랜 느낌) -->

              <div class="flex items-center justify-between text-[11px] text-amber-400 font-mono font-bold">
                <span>📌 당시 발언 원문</span>
                <span class="text-slate-500">${item.quoteSource}</span>
              </div>
              <p class="text-xs sm:text-sm text-slate-300 italic leading-relaxed">
                "${item.quoteText}"
              </p>
            </div>

            <!-- 중앙 Reddit식 대비선 -->
            <div class="relative flex py-1 items-center justify-center">
              <div class="flex-grow border-t border-slate-800"></div>
              <span class="flex-shrink mx-3 text-[10px] font-mono font-black uppercase tracking-widest text-slate-500 bg-[#161b22] px-2 py-0.5 rounded border border-slate-800">
                ⬇️ ${item.verdictTime} ⬇️
              </span>
              <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <!-- 하단 박제: 냉정한 현실 참교육 결과 (고대비) -->
            <div class="bg-[#0e1117] border border-slate-800 rounded-xl p-3.5 space-y-1.5">
              <div class="flex items-center justify-between text-[11px] font-bold text-emerald-400">
                <span>⚖️ 역사의 실제 판결</span>
                <span class="text-[10px] text-slate-400 font-mono">${item.realityStat}</span>
              </div>
              <p class="text-xs text-slate-300 leading-relaxed font-medium">
                ${item.realityText}
              </p>
            </div>

            <!-- 3. 실전 오판 방지 교훈 (Actionable Insight) -->
            <div class="bg-gradient-to-r from-orange-950/20 to-amber-950/10 border border-orange-500/20 rounded-xl p-3">
              <p class="text-xs text-orange-200/90 leading-relaxed">
                <strong class="text-orange-400 font-extrabold mr-1">💡 팩폭 교훈:</strong> ${item.lesson}
              </p>
            </div>
          </div>

          <!-- 4. 레딧식 1클릭 추천/박제 반응 바 -->
          <div class="px-4 py-2.5 bg-slate-900/60 border-t border-slate-800/80 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
              <button onclick="castVote('${item.id}', 'up')" class="vote-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-700 hover:border-orange-500 hover:text-orange-400 transition ${userVoted === 'up' ? 'bg-orange-500 text-white font-bold border-orange-500' : 'bg-slate-800/80 text-slate-300'}">

                <span id="up-count-${item.id}" class="font-mono font-bold">${item.upvotes + (userVoted === 'up' ? 1 : 0)}</span>

              <button onclick="castVote('${item.id}', 'down')" class="vote-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-700 hover:border-slate-500 transition ${userVoted === 'down' ? 'bg-slate-700 text-white font-bold' : 'bg-slate-800/80 text-slate-400'}">
                <span>🤔 당시엔 그럴듯함</span>
                <span id="down-count-${item.id}" class="font-mono">${item.disagrees + (userVoted === 'down' ? 1 : 0)}</span>

    function castVote(id, type) {
      const votedKey = `voted_${id}`;
      const prev = localStorage.getItem(votedKey);
      if (prev) {
        alert("이미 이 사건에 성지순례 투표를 완료하셨습니다!");
        return;
      }
      localStorage.setItem(votedKey, type);
      renderFeed(currentEra);
    }

    let currentEra = 'ALL';
    function filterEra(era) {
      currentEra = era;
      document.querySelectorAll('.era-btn').forEach(btn => {
        if (btn.dataset.era === era) {
          btn.className = "era-btn active px-3 py-1 rounded-lg bg-orange-500 text-white font-bold transition";
        } else {
          btn.className = "era-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
        }
      });
      renderFeed(era);
    }

    renderFeed();
