<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aged Like Milk - Historical Track Record</title>
  <meta name="description" content="Iconic predictions and brutal reality checks from the Industrial Revolution to AI.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    .tubik-card { box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.5); }
    .tubik-glass { background: rgba(22, 27, 38, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-[#0b0e14] text-slate-100 min-h-screen py-6 px-3 flex flex-col items-center selection:bg-orange-500 selection:text-white">

  <!-- Dribbble Mobile Frame Container -->
  <main class="w-full max-w-[420px] space-y-4">
    
    <!-- Top App Bar -->
    <header class="tubik-glass border border-slate-800/80 rounded-[28px] p-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-orange-500 via-rose-500 to-amber-400 p-0.5 shadow-lg shadow-orange-500/20">
          <div class="w-full h-full bg-[#0e121a] rounded-[14px] flex items-center justify-center font-black text-white text-base">
            🥛
          </div>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm font-black tracking-tight text-white" id="ui-app-title">AGED LIKE MILK</h1>
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          </div>
          <p class="text-[11px] font-semibold text-slate-400" id="ui-app-sub">AI & Tech Reality Tracker</p>
        </div>
      </div>

      <!-- Language Toggle & Nav -->
      <div class="flex items-center gap-1.5 bg-[#0e121a] p-1 rounded-2xl border border-slate-800">
        <button onclick="setLang('ko')" id="btn-ko" class="px-2.5 py-1 rounded-xl text-[11px] font-extrabold bg-gradient-to-r from-orange-500 to-rose-500 text-white shadow transition">KO</button>
        <button onclick="setLang('en')" id="btn-en" class="px-2.5 py-1 rounded-xl text-[11px] font-extrabold text-slate-400 hover:text-white transition">EN</button>
      </div>
    </header>

    <!-- Visual Category Selector (Tubik Pill Style) -->
    <nav class="flex items-center gap-2 overflow-x-auto pb-1 text-xs font-bold no-scrollbar" id="filter-container">
      <button onclick="filterFeed('ALL')" class="filter-btn active px-4 py-2 rounded-2xl bg-white text-black font-extrabold shadow-md transition whitespace-nowrap" data-type="ALL" id="btn-all">
        ⚡ ALL REVIEWS
      </button>
      <button onclick="filterFeed('LESSON')" class="filter-btn px-4 py-2 rounded-2xl bg-[#161b26] text-slate-400 border border-slate-800 hover:text-white transition whitespace-nowrap" data-type="LESSON" id="btn-lesson">
        🏛️ HISTORIC BLUNDERS
      </button>
      <button onclick="filterFeed('TRACK')" class="filter-btn px-4 py-2 rounded-2xl bg-[#161b26] text-slate-400 border border-slate-800 hover:text-white transition whitespace-nowrap" data-type="TRACK" id="btn-track">
        📊 TRACK RECORDS
      </button>
    </nav>

    <!-- Cards Feed -->
    <section id="feed-container" class="space-y-4"></section>

    <!-- Footer -->
    <footer class="text-center py-6 space-y-1">
      <p class="text-[11px] font-bold text-slate-600 tracking-wider uppercase">InsightLab Product Design Edition</p>
      <p class="text-[10px] text-slate-700">© 2026 InsightLab · Built with Surgical Simplicity</p>
    </footer>
  </main>

  <script>
    let currentLang = 'ko';
    let currentFilter = 'ALL';

    const I18N = {
      ko: {
        appTitle: "AGED LIKE MILK",
        appSub: "빅마우스 호언장담 사후 검증소",
        btnAll: "⚡ 전체 피드",
        btnLesson: "🏛️ 역사의 참교육",
        btnTrack: "📊 빅마우스 성적표",
        tagLesson: "역사의 참교육",
        tagTrack: "시장 성적표",
        quoteLabel: "STATEMENT",
        realityLabel: "REALITY CHECK",
        takeawayLabel: "ANTIDOTE",
        voteFail: "🔥 처참한 오판",
        votePass: "🤔 나름 타당함",
        votedBadge: "성지순례 완료"
      },
      en: {
        appTitle: "AGED LIKE MILK",
        appSub: "Tech Reality Tracker",
        btnAll: "⚡ ALL REVIEWS",
        btnLesson: "🏛️ HISTORIC BLUNDERS",
        btnTrack: "📊 TRACK RECORDS",
        tagLesson: "HISTORICAL REALITY",
        tagTrack: "MARKET VERDICT",
        quoteLabel: "STATEMENT",
        realityLabel: "REALITY CHECK",
        takeawayLabel: "ANTIDOTE",
        voteFail: "🔥 AGED LIKE MILK",
        votePass: "🤔 REASONABLE THEN",
        votedBadge: "VERIFIED"
      }
    };

    const POSTS = [
      {
        id: "p1",
        cardType: "LESSON",
        themeGradient: "from-rose-500 via-red-500 to-orange-400",
        badgeColor: "bg-rose-500/20 text-rose-300 border-rose-500/30",
        era: { ko: "1830s · 산업혁명", en: "1830s · Industrial Rev." },
        author: { ko: "영국 왕립학회 학자단", en: "Royal Society Scholars" },
        role: { ko: "당대 최고 과학 지식인", en: "Top Scientific Council" },
        statMetric: "300+ km/h",
        statSub: { ko: "현재 고속철도 운행속도", en: "Modern High-Speed Rail" },
        title: {
          ko: "시속 40km로 달리면 승객들은 질식사한다",
          en: "Passengers will die of asphyxiation at 30mph"
        },
        quote: {
          ko: "인간의 신체는 시속 30마일의 속도를 견디도록 설계되지 않았다. 공기가 폐로 들어오지 않아 전원 질식사할 것이다.",
          en: "The human body is not built for 30 mph. Air cannot enter the lungs, causing immediate asphyxiation."
        },
        reality: {
          ko: "철도는 영국 전역을 반나절 생활권으로 묶으며 1차 산업혁명의 심장이 되었습니다. 승객의 폐는 멀쩡했습니다.",
          en: "Railroads revolutionized transit across Britain, becoming the core engine of the Industrial Revolution."
        },
        antidote: {
          ko: "새 기술이 태동할 때 인간은 언제나 '과학으로 포장된 원초적 공포'를 배설합니다. 공포 마케팅에 휘둘리지 마세요.",
          en: "Breakthrough tools always trigger primal fear disguised as science. Never let fear delay your adoption."
        },
        chartSvg: `<path d="M0 35 Q 30 32, 60 28 T 120 8" fill="none" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>`,
        upvotes: 612,
        disagrees: 18
      },
      {
        id: "p2",
        cardType: "LESSON",
        themeGradient: "from-amber-500 via-orange-500 to-yellow-400",
        badgeColor: "bg-amber-500/20 text-amber-300 border-amber-500/30",
        era: { ko: "1998 · 닷컴 태동기", en: "1998 · Dot-Com Era" },
        author: { ko: "폴 크루그먼", en: "Paul Krugman" },
        role: { ko: "노벨 경제학상 수상자", en: "Nobel Laureate in Economics" },
        statMetric: "TOP 10",
        statSub: { ko: "인터넷 빅테크 글로벌 시총 독식", en: "Tech Dominates Global Top 10" },
        title: {
          ko: "인터넷 경제 효과는 팩스(Fax) 수준에 그칠 것",
          en: "Internet's economic impact: no greater than a fax machine"
        },
        quote: {
          ko: "2005년쯤 되면 인터넷의 경제적 영향력은 팩스 기기보다 크지 않았음이 만천하에 드러날 것이다.",
          en: "By 2005, it will be clear that the Internet's impact has been no greater than the fax machine's."
        },
        reality: {
          ko: "인터넷은 통신 도구를 넘어 인류의 문명과 금융을 재편했습니다. 노벨상 석학조차 '네트워크 효과'의 기하급수 확장을 못 봤습니다.",
          en: "The Internet swallowed global commerce. Even Nobel laureates severely underestimated exponential network effects."
        },
        antidote: {
          ko: "기존 분야의 최고 석학일수록 자신의 낡은 잣대로 새 패러다임을 폄하합니다. 권위자의 '거품론'에 안주하지 마세요.",
          en: "Legacy domain experts make the worst forecasts on paradigm shifts. Don't hide behind their complacency."
        },
        chartSvg: `<path d="M0 35 Q 40 34, 80 18 T 120 4" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>`,
        upvotes: 843,
        disagrees: 24
      },
      {
        id: "p3",
        cardType: "TRACK",
        themeGradient: "from-violet-600 via-indigo-600 to-blue-500",
        badgeColor: "bg-indigo-500/20 text-indigo-300 border-indigo-500/30",
        era: { ko: "2023 · 생성형 AI", en: "2023 · Generative AI" },
        author: { ko: "샘 알트만", en: "Sam Altman" },
        role: { ko: "OpenAI CEO", en: "CEO of OpenAI" },
        statMetric: "o1 / GPT-4o",
        statSub: { ko: "추론 모델 연달아 장악 독주", en: "Successive Reasoning Releases" },
        title: {
          ko: "현재 LLM은 지능이 아니다. AGI는 아직 멀었다",
          en: "LLMs are not thinking minds. Far from AGI"
        },
        quote: {
          ko: "현재의 언어 모델들은 그저 유용한 도구일 뿐입니다. 우리는 여전히 진정한 AGI와는 꽤 거리가 멉니다.",
          en: "Current LLMs are useful tools, not thinking minds. We are still quite far from true AGI."
        },
        reality: {
          ko: "발언 직후 복합 추론 모델들을 전격 공개하며 시장을 집어삼켰습니다. 독점 비판과 정부 규제를 피하기 위한 고도의 연막이었습니다.",
          en: "OpenAI aggressively launched advanced reasoning models, confirming that public humility was regulatory sandbagging."
        },
        antidote: {
          ko: "빅테크 파운더가 '우린 아직 부족하다'고 겸손을 떨 때는, 규제 당국의 방심과 경쟁자의 늑장 대응을 유도하는 전략입니다.",
          en: "When founders perform strategic humility, it is calculated to buy time against antitrust regulations."
        },
        chartSvg: `<path d="M0 25 Q 30 15, 60 20 T 120 6" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>`,
        upvotes: 521,
        disagrees: 36
      },
      {
        id: "p4",
        cardType: "TRACK",
        themeGradient: "from-emerald-500 via-teal-500 to-cyan-500",
        badgeColor: "bg-emerald-500/20 text-emerald-300 border-emerald-500/30",
        era: { ko: "2022 · 크립토 하락장", en: "2022 · Crypto Bear" },
        author: { ko: "마이클 세일러", en: "Michael Saylor" },
        role: { ko: "마이크로스트래티지 의장", en: "Chairman, MicroStrategy" },
        statMetric: "$100K+",
        statSub: { ko: "비트코인 신고가 돌파 폭등", en: "Bitcoin All-Time High" },
        title: {
          ko: "비트코인이 2만 불 밑으로 떨어져도 절대 안 판다",
          en: "We will not sell even below $20,000"
        },
        quote: {
          ko: "우리는 단 1사토시도 팔지 않습니다. 회사의 모든 자금과 무이자 전환사채를 동원해 계속 매수할 것입니다.",
          en: "We will not sell. We will continue acquiring Bitcoin with corporate cash and debt structures."
        },
        reality: {
          ko: "청산 루머를 버텨내고 비트코인이 10만 달러를 돌파하며 수조 원의 평가익과 나스닥 최상위권 상승률을 기록했습니다.",
          en: "MicroStrategy survived margin calls and surged into an S&P outperformer backed by multi-billion dollar unrealized gains."
        },
        antidote: {
          ko: "조롱받는 하락장에서도 '만기 압박이 없는 자금 조달 구조'를 짜둔 집착은 사이클 전환 시 파괴적인 비대칭 보상을 낳습니다.",
          en: "Conviction engineered with zero liquidation pressure yields massive asymmetric payoff upon macro reversal."
        },
        chartSvg: `<path d="M0 38 Q 40 40, 70 20 T 120 4" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>`,
        upvotes: 789,
        disagrees: 42
      }
    ];

    function updateUiLabels() {
      const t = I18N[currentLang];
      document.getElementById('ui-app-title').innerText = t.appTitle;
      document.getElementById('ui-app-sub').innerText = t.appSub;
      document.getElementById('btn-all').innerText = t.btnAll;
      document.getElementById('btn-lesson').innerText = t.btnLesson;
      document.getElementById('btn-track').innerText = t.btnTrack;

      const btnKo = document.getElementById('btn-ko');
      const btnEn = document.getElementById('btn-en');
      if (currentLang === 'ko') {
        btnKo.className = "px-2.5 py-1 rounded-xl text-[11px] font-extrabold bg-gradient-to-r from-orange-500 to-rose-500 text-white shadow transition";
        btnEn.className = "px-2.5 py-1 rounded-xl text-[11px] font-extrabold text-slate-400 hover:text-white transition";
      } else {
        btnEn.className = "px-2.5 py-1 rounded-xl text-[11px] font-extrabold bg-gradient-to-r from-orange-500 to-rose-500 text-white shadow transition";
        btnKo.className = "px-2.5 py-1 rounded-xl text-[11px] font-extrabold text-slate-400 hover:text-white transition";
      }
    }

    function renderFeed(filter = 'ALL') {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';
      const t = I18N[currentLang];

      const filtered = filter === 'ALL' ? POSTS : POSTS.filter(item => item.cardType === filter);

      filtered.forEach(item => {
        const votedKey = `tubik_voted_${item.id}`;
        const userVoted = localStorage.getItem(votedKey);

        const card = document.createElement('article');
        card.className = "tubik-card bg-[#141824] border border-slate-800/80 rounded-[32px] p-5 space-y-4 relative overflow-hidden transition-all duration-300 hover:border-slate-700";

        card.innerHTML = `
          <!-- Top Row: Avatar & Hero Metric Pill -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${item.themeGradient} p-0.5 shadow-lg">
                <div class="w-full h-full bg-[#141824] rounded-[14px] flex items-center justify-center text-white font-black text-lg">
                  ${item.author[currentLang].charAt(0)}
                </div>
              </div>
              <div>
                <h3 class="font-extrabold text-sm text-white tracking-tight leading-tight">${item.author[currentLang]}</h3>
                <p class="text-[11px] font-semibold text-slate-400">${item.role[currentLang]}</p>
                <span class="text-[10px] font-mono text-slate-500">${item.era[currentLang]}</span>
              </div>
            </div>

            <!-- Mini Sparkline + Stat Pill -->
            <div class="bg-[#0b0e14] border border-slate-800 rounded-2xl p-2 px-3 text-right">
              <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">${item.statSub[currentLang]}</span>
              <div class="flex items-center justify-end gap-2 mt-0.5">
                <svg class="w-14 h-6 overflow-visible" viewBox="0 0 120 40">
                  ${item.chartSvg}
                </svg>
                <span class="text-xs font-black text-white font-mono">${item.statMetric}</span>
              </div>
            </div>
          </div>

          <!-- Hero Headline -->
          <h2 class="text-base font-extrabold text-white tracking-tight leading-snug pt-1">
            ${item.title[currentLang]}
          </h2>

          <!-- Dribbble Style Vibrant Quote Card -->
          <div class="bg-gradient-to-br ${item.themeGradient} p-0.5 rounded-2xl shadow-lg">
            <div class="bg-[#0e121a]/95 rounded-[15px] p-4 space-y-1">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-mono font-black tracking-widest text-slate-400 uppercase">${t.quoteLabel}</span>
                <span class="text-xs">💬</span>
              </div>
              <p class="text-xs sm:text-sm font-semibold text-slate-100 italic leading-relaxed">
                "${item.quote[currentLang]}"
              </p>
            </div>
          </div>

          <!-- Reality Outcome Box -->
          <div class="bg-[#0e121a] border border-slate-800/80 rounded-2xl p-3.5 space-y-1">
            <div class="flex items-center justify-between text-[11px] font-bold text-slate-400">
              <span class="text-emerald-400 font-extrabold uppercase tracking-wider">⚡ ${t.realityLabel}</span>
              <span class="text-[10px] font-mono text-slate-500">VERIFIED METRIC</span>
            </div>
            <p class="text-xs text-slate-300 font-medium leading-relaxed">
              ${item.reality[currentLang]}
            </p>
          </div>

          <!-- The Antidote (Core Takeaway Pill) -->
          <div class="bg-white/5 border border-white/10 rounded-2xl p-3 flex items-start gap-2.5">
            <div class="w-5 h-5 rounded-full bg-amber-400/20 text-amber-300 flex items-center justify-center text-xs flex-shrink-0 mt-0.5">💡</div>
            <p class="text-xs font-semibold text-slate-200 leading-relaxed">
              <strong class="text-amber-300 font-extrabold mr-1">${t.takeawayLabel}:</strong> ${item.antidote[currentLang]}
            </p>
          </div>

          <!-- Interactive Action Bar (Capsule Style) -->
          <div class="pt-1 flex items-center justify-between gap-2">
            <button onclick="castVote('${item.id}', 'fail')" class="flex-1 py-2.5 px-3 rounded-2xl text-xs font-extrabold flex items-center justify-center gap-1.5 border transition active:scale-95 ${userVoted === 'fail' ? 'bg-rose-500 border-rose-400 text-white shadow-lg shadow-rose-500/30' : 'bg-[#0e121a] border-slate-800 text-slate-300 hover:border-slate-700'}">
              <span>${t.voteFail}</span>
              <span class="font-mono text-[11px] opacity-80">${item.upvotes + (userVoted === 'fail' ? 1 : 0)}</span>
            </button>
            <button onclick="castVote('${item.id}', 'pass')" class="flex-1 py-2.5 px-3 rounded-2xl text-xs font-extrabold flex items-center justify-center gap-1.5 border transition active:scale-95 ${userVoted === 'pass' ? 'bg-slate-700 border-slate-600 text-white' : 'bg-[#0e121a] border-slate-800 text-slate-400 hover:border-slate-700'}">
              <span>${t.votePass}</span>
              <span class="font-mono text-[11px] opacity-80">${item.disagrees + (userVoted === 'pass' ? 1 : 0)}</span>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function castVote(id, type) {
      const votedKey = `tubik_voted_${id}`;
      const prev = localStorage.getItem(votedKey);
      if (prev) {
        alert(currentLang === 'ko' ? "이미 투표에 참여하셨습니다!" : "You have already voted!");
        return;
      }
      localStorage.setItem(votedKey, type);
      renderFeed(currentFilter);
    }

    function filterFeed(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "filter-btn active px-4 py-2 rounded-2xl bg-white text-black font-extrabold shadow-md transition whitespace-nowrap";
        } else {
          btn.className = "filter-btn px-4 py-2 rounded-2xl bg-[#161b26] text-slate-400 border border-slate-800 hover:text-white transition whitespace-nowrap";
        }
      });
      renderFeed(type);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('tubik_lang', lang);
      document.documentElement.lang = lang;
      updateUiLabels();
      renderFeed(currentFilter);
    }

    const savedLang = localStorage.getItem('tubik_lang');
    if (savedLang) {
      currentLang = savedLang;
    } else if (!navigator.language.startsWith('ko')) {
      currentLang = 'en';
    }

    document.documentElement.lang = currentLang;
    updateUiLabels();
    renderFeed();
  </script>
</body>
</html>
