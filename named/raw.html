    function renderCards(filter = 'ALL') {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      const filtered = filter === 'ALL' ? DATA : DATA.filter(item => item.category === filter);

      filtered.forEach(item => {
        // 결과 뱃지 색상 및 태그
        let badgeBg, badgeBorder, badgeText, statusIcon;
        if (item.resultType === 'success') {
          badgeBg = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
          badgeText = '적중 / 성공';
          statusIcon = '✓';
        } else if (item.resultType === 'fail') {
          badgeBg = 'bg-rose-500/10 text-rose-400 border-rose-500/30';
          badgeText = '예측 빗나감';
          statusIcon = '✕';
        } else {
          badgeBg = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
          badgeText = '반전 / 복합';
          statusIcon = '△';
        }

        const card = document.createElement('article');
        card.className = "bg-[#131926] border border-slate-800 rounded-2xl p-5 shadow-2xl relative overflow-hidden transition hover:border-slate-700";

        card.innerHTML = `
          <!-- 1. 소셜 프로필 헤더 -->
          <div class="flex items-center justify-between gap-3 mb-4">
            <div class="flex items-center gap-2.5">

              <div>

                  <span class="text-[11px] text-slate-400">${item.handle}</span>
                </div>
                <div class="text-[11px] text-slate-500 flex items-center gap-1.5">
                  <span>${item.role}</span>
                  <span>·</span>
                  <span>${item.date}</span>
                </div>
              </div>
            </div>
            <span class="text-[11px] font-mono font-bold px-2.5 py-1 rounded-full border ${badgeBg} flex items-center gap-1">
              <span>${statusIcon}</span> ${badgeText}
            </span>
          </div>

            <p class="text-base sm:text-lg font-black text-white tracking-tight leading-snug">
              "${item.punchline}"
            </p>
            <p class="text-[11px] text-slate-400 font-mono italic">
              ${item.originalQuote}

          <div class="bg-[#0b0f17] rounded-xl p-3.5 border border-slate-800/80 mb-3 space-y-1.5">

              <span class="text-amber-400">📊</span>
              <span>현실 성적표: <strong class="text-slate-200">${item.verdict}</strong></span>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed">
              ${item.realityText}
            </p>
          </div>

          <!-- 4. 팩폭 인사이트 (형광 하이라이트 느낌) -->

        `;

    function filterCategory(category) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.category === category) {
          btn.className = "filter-btn active px-3 py-1.5 rounded-full bg-white text-black transition";

      renderCards(category);
