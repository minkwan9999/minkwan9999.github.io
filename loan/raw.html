<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대출 중도상환 vs 주식·배당 투자 수익률 격돌 계산기</title>
  <meta name="description" content="목돈이 생겼을 때 대출 상환이 이득일까 주식 투자가 이득일까? 세후 실질 수익과 손익분기 수익률을 비교합니다.">
  <meta property="og:title" content="대출 갚을까? 주식 살까? 중도상환 vs 투자 시뮬레이터">
  <meta property="og:description" content="확정 대출이자 절감액 vs 세후 투자 수익 비교. 내 손익분기 수익률을 3초 만에 계산해 보세요.">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen p-4 flex flex-col items-center">

  <main class="w-full max-w-lg bg-white rounded-2xl shadow-sm border border-slate-200 p-5 my-4">
    <div class="border-b border-slate-100 pb-4 mb-5 text-center">
      <span class="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-600 rounded-full">40대 자산 최적화 시뮬레이터</span>
      <h1 class="text-xl font-bold mt-2 text-slate-900">대출 상환 vs 주식 투자 격돌</h1>
      <p class="text-xs text-slate-500 mt-1">목돈이 생겼을 때, 빚 갚기 vs 투자 중 진짜 남는 장사는?</p>
    </div>

    <!-- 입력 폼 -->
    <div class="space-y-4 text-sm">
      <div>
        <label class="block font-medium text-slate-700 mb-1">고민 중인 목돈 (원)</label>
        <input type="number" id="lumpSum" value="30000000" step="1000000" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        <span id="lumpSumText" class="text-xs text-slate-400 mt-1 block">3,000만 원</span>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-medium text-slate-700 mb-1">현재 대출 금리 (%)</label>
          <input type="number" id="loanRate" value="4.2" step="0.1" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">비교 기간 (년)</label>
          <select id="years" class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="3">3년</option>
            <option value="5" selected>5년</option>
            <option value="10">10년</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block font-medium text-slate-700 mb-1">목표 세전 투자 수익률 (연 %)</label>
        <input type="number" id="investRate" value="7.0" step="0.5" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block font-medium text-slate-700 mb-1">투자 대상 및 세금 유형</label>
        <select id="taxType" class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="dividend">국내/배당 ETF (배당소득세 15.4%)</option>
          <option value="us_stock">미국 직투/지수 ETF (양도세 22%)</option>
          <option value="isa">ISA/비과세 계좌 (세금 0%)</option>
        </select>
      </div>

      <button onclick="calculate()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm transition mt-2">
        결과 비교하기
      </button>
    </div>

    <!-- 결과 영역 -->
    <div id="resultArea" class="mt-6 border-t border-slate-100 pt-5 space-y-4">
      
      <!-- 핵심 손익분기 하이라이트 박스 -->
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-center">
        <p class="text-xs font-semibold text-amber-800 uppercase tracking-wide">투자 손익분기점 (Break-Even)</p>
        <p id="breakEvenHero" class="text-2xl font-black text-amber-950 mt-1">-</p>
        <p id="breakEvenSub" class="text-xs text-amber-700 mt-1">이 수익률을 못 넘기면 빚 갚는 게 무조건 이득입니다.</p>
      </div>

      <!-- 최종 우세 뱃지 -->
      <div id="summaryBadge" class="p-3.5 rounded-xl text-center font-bold text-base"></div>

      <!-- 수치 비교 그리드 -->
      <div class="grid grid-cols-2 gap-3 text-center">
        <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
          <p class="text-xs text-slate-500 mb-1">대출 상환 시</p>
          <p class="text-xs font-semibold text-slate-600">확정 이자 절감액</p>
          <p id="savedInterest" class="text-base font-bold text-slate-800 mt-1">-</p>
        </div>
        <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
          <p class="text-xs text-slate-500 mb-1">투자 시</p>
          <p class="text-xs font-semibold text-slate-600">세후 실질 순수익</p>
          <p id="netProfit" class="text-base font-bold text-slate-800 mt-1">-</p>
        </div>
      </div>

      <!-- 커뮤니티 복사용 버튼 -->
      <button onclick="copyResultSummary()" id="copyBtn" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg text-xs transition flex items-center justify-center gap-1.5 border border-slate-200">
        📋 결과 요약 텍스트 복사하기 (커뮤니티/단톡 공유)
      </button>
    </div>
  </main>

  <script>
    const won = (n) => (Math.round(n)).toLocaleString('ko-KR') + '원';

    document.getElementById('lumpSum').addEventListener('input', (e) => {
      const v = Number(e.target.value) || 0;
      document.getElementById('lumpSumText').innerText = (v / 10000).toLocaleString('ko-KR') + '만 원';
    });

    let currentSummaryText = "";

    function calculate() {
      const lump = parseFloat(document.getElementById('lumpSum').value) || 0;
      const loanR = (parseFloat(document.getElementById('loanRate').value) || 0) / 100;
      const invR = (parseFloat(document.getElementById('investRate').value) || 0) / 100;
      const years = parseInt(document.getElementById('years').value, 10);
      const taxType = document.getElementById('taxType').value;

      let taxRate = 0.154;
      let taxLabel = "배당소득세 15.4%";
      if (taxType === 'us_stock') { taxRate = 0.22; taxLabel = "양도세 22%"; }
      if (taxType === 'isa') { taxRate = 0.0; taxLabel = "비과세 0%"; }

      const savedInterestVal = lump * (Math.pow(1 + loanR, years) - 1);
      const grossFuture = lump * Math.pow(1 + invR, years);
      const grossProfit = grossFuture - lump;
      const netProfitVal = grossProfit * (1 - taxRate);

      const diff = netProfitVal - savedInterestVal;
      const breakEvenRate = (loanR / (1 - taxRate)) * 100;

      document.getElementById('savedInterest').innerText = won(savedInterestVal);
      document.getElementById('netProfit').innerText = won(netProfitVal);
      document.getElementById('breakEvenHero').innerText = `최소 연 ${breakEvenRate.toFixed(2)}% 이상`;

      const badge = document.getElementById('summaryBadge');
      let winText = "";
      if (diff > 0) {
        badge.className = 'p-3.5 rounded-xl text-center font-bold text-base bg-emerald-100 text-emerald-800 border border-emerald-200';
        badge.innerHTML = `투자가 <span class="underline underline-offset-4">${won(diff)}</span> 더 이득입니다`;
        winText = `투자 우세 (+${won(diff)})`;
      } else {
        badge.className = 'p-3.5 rounded-xl text-center font-bold text-base bg-rose-100 text-rose-800 border border-rose-200';
        badge.innerHTML = `대출 상환이 <span class="underline underline-offset-4">${won(Math.abs(diff))}</span> 더 이득입니다`;
        winText = `대출 상환 우세 (+${won(Math.abs(diff))})`;
      }

      currentSummaryText = `[대출 상환 vs 투자 계산 결과]
- 목돈: ${(lump/10000).toLocaleString()}만 원 (${years}년 기준)
- 대출금리: ${(loanR*100).toFixed(1)}% | 투자목표: ${(invR*100).toFixed(1)}% (${taxLabel})
- 확정 이자 절감액: ${won(savedInterestVal)}
- 투자 세후 실수령: ${won(netProfitVal)}
- 손익분기: 투자로 이기려면 최소 연 ${breakEvenRate.toFixed(2)}% 수익 필요
👉 결론: ${winText}
https://minkwan9999.github.io/Loan/`;
    }

    function copyResultSummary() {
      if (!currentSummaryText) calculate();
      navigator.clipboard.writeText(currentSummaryText).then(() => {
        const btn = document.getElementById('copyBtn');
        const orig = btn.innerText;
        btn.innerText = '✅ 복사 완료! 원하는 곳에 붙여넣기 하세요';
        setTimeout(() => { btn.innerText = orig; }, 2000);
      });
    }

    calculate();
  </script>
</body>
</html>
