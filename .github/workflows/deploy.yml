name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Detect and Inject Adsense/GA4 & Copy to Root
        run: python3 scripts/inject_ads.py

      - name: Commit generated index.html files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: inject GA4/Adsense into index.html"
          file_pattern: '**/index.html'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
