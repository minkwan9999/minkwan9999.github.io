name: Check Rank Data (Manual)

on:
  workflow_dispatch:

jobs:
  check-data:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 구조 및 신선도 검사
        run: python scripts/check_rank_data.py
