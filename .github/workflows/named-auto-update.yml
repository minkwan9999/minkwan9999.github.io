name: Weekly Named App Updater

on:
  schedule:
    - cron: '0 1 * * 1'   # 매주 월요일 01:00 UTC = 한국시간 오전 10시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-named:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Python 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 새 글 7개 추가
        run: |
          for i in 1 2 3 4 5 6 7; do
            echo "=== ${i}번째 글감 추가 ==="
            python scripts/update_named.py
          done

      - name: 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add named/posts.json scripts/named_pool.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-add 7 new named quotes (weekly batch)" && git push)
