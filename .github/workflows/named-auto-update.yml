name: Daily Named App Updater

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-named:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 팩트체크 및 HTML 업데이트 실행
        run: python scripts/update_named.py

      - name: raw.html → index.html 재생성
        run: python3 scripts/inject_ads.py

      - name: 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add named/raw.html named/index.html index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-add new named quote and update timestamp" && git push)
