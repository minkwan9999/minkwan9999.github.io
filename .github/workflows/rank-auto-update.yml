name: Daily Rank Auto Updater

on:
  schedule:
    # 매일 UTC 00:00 (한국 시간 기준 매일 오전 09:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Rank Auto Updater
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_rank.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rank/raw.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily auto-update social rank data" && git push)
