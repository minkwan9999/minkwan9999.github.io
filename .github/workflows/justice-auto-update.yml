name: Daily Justice App Updater

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-justice:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Python 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 새 사건 추가
        run: python scripts/update_justice.py

      - name: 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add justice/posts.json scripts/justice_pool.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-add new justice case" && git push)
