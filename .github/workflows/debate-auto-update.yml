name: Daily Debate App Updater

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-debate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Python 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 새 논쟁 추가
        run: python scripts/update_debate.py

      - name: 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add debate/posts.json scripts/debate_pool.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-add new debate topic" && git push)
