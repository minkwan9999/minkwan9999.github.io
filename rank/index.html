<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인사이트랩 - 소셜 트렌드 리더보드 (Social Rank)</title>
  <meta name="description" content="유튜브, 틱톡, 스레드, 인스타그램, X의 매체별 TOP 5 주간 급상승 크리에이터 및 바이럴 트렌드 순위표.">
  <meta property="og:title" content="인사이트랩: 소셜 트렌드 리더보드">
  <meta property="og:description" content="5대 플랫폼별 주간 TOP 5 떡상 크리에이터 및 지표 분석">
  <script src="https://cdn.tailwindcss.com"></script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q543DWEBBW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-Q543DWEBBW');
</script>
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=pub-1957248819245044" crossorigin="anonymous"></script>

</head>
<body class="bg-[#0e1117] text-slate-200 antialiased min-h-screen py-5 px-3 flex flex-col items-center selection:bg-amber-500 selection:text-white">

  <main class="w-full max-w-md space-y-3.5">
    <!-- 상단 헤더 -->
    <header class="bg-[#161b22] border border-slate-800 rounded-2xl p-3.5 shadow-lg space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center font-black text-white text-sm shadow shrink-0">
            🏆
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold text-white text-sm tracking-tight truncate" id="ui-subname">소셜 트렌드 순위표</span>
              <span class="text-[10px] bg-amber-500/20 text-amber-400 font-bold px-1.5 py-0.5 rounded border border-amber-500/30 shrink-0" id="ui-subtag">매체별 TOP 5</span>
            </div>
            <p class="text-[11px] text-slate-400 truncate" id="ui-subtitle">터치하여 떡상 비결 & 바이럴 지표 확인</p>
          </div>
        </div>

        <!-- 언어 토글 & 홈 링크 -->
        <div class="flex items-center gap-1.5 shrink-0">
          <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg p-0.5 text-[11px] font-bold">
            <button onclick="setLang('ko')" id="btn-ko" class="px-2 py-0.5 rounded bg-amber-500 text-black font-extrabold transition">KO</button>
            <button onclick="setLang('en')" id="btn-en" class="px-2 py-0.5 rounded text-slate-400 hover:text-white transition">EN</button>
          </div>
          <a href="/" class="text-xs text-slate-400 hover:text-white px-1 whitespace-nowrap transition" id="ui-home">홈</a>
        </div>
      </div>

      <!-- 6개 플랫폼 필터 버튼 바 -->
      <div class="flex items-center gap-1.5 pt-2 border-t border-slate-800/80 text-xs font-semibold overflow-x-auto whitespace-nowrap">
        <button onclick="filterType('ALL')" class="filter-btn active px-3 py-1 rounded-lg bg-amber-500 text-black font-extrabold transition" data-type="ALL" id="filter-all">종합 순위</button>
        <button onclick="filterType('YOUTUBE')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="YOUTUBE" id="filter-yt">유튜브</button>
        <button onclick="filterType('TIKTOK')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="TIKTOK" id="filter-tt">틱톡</button>
        <button onclick="filterType('THREADS')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="THREADS" id="filter-th">스레드</button>
        <button onclick="filterType('INSTA')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="INSTA" id="filter-ig">인스타</button>
        <button onclick="filterType('X')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="X" id="filter-x">X</button>
      </div>
    </header>

    <!-- 리더보드 테이블 헤더 라벨 -->
    <div class="px-3 flex items-center justify-between text-[11px] font-bold text-slate-500 font-mono">
      <span>RANK · CREATOR</span>
      <span>GROWTH / SCALE</span>
    </div>

    <!-- 리더보드 리스트 컨테이너 -->
    <div id="leaderboard-container" class="space-y-2">
      <p class="text-center text-slate-500 py-10 text-sm">불러오는 중...</p>
    </div>

    <!-- 하단 푸터 -->
    <footer class="pt-3 pb-6 text-center text-xs text-slate-500 space-y-1">
      <p id="ui-footer-note">주간 조회수 급상승폭 및 인게이지먼트 지표를 기반으로 집계되었습니다.</p>
      <p>© 2026 인사이트랩 (InsightLab) · Leaderboard Edition</p>
    </footer>
  </main>

  <script>
    let currentLang = 'ko';
    let currentFilter = 'ALL';
    let expandedId = null;
    let RANKS = [];

    const I18N = {
      ko: {
        subname: "소셜 트렌드 순위표",
        subtag: "매체별 TOP 5",
        subtitle: "터치하여 떡상 비결 & 바이럴 지표 확인",
        home: "홈",
        filterAll: "종합 순위",
        filterYt: "유튜브",
        filterTt: "틱톡",
        filterTh: "스레드",
        filterIg: "인스타",
        filterX: "X",
        statFollowers: "총 구독/팔로워",
        statGrowth: "주간 상승폭",
        viralKeyword: "바이럴 키워드",
        reasonTitle: "💡 알고리즘 떡상 포인트:",
        voteAcknowledge: "🔥 찐 인정",
        voteHype: "🤔 거품이다",
        votedBadge: "투표 완료",
        footerNote: "주간 조회수 급상승폭 및 인게이지먼트 지표를 기반으로 집계되었습니다.",
        loadError: "데이터를 불러오지 못했습니다."
      },
      en: {
        subname: "Social Leaderboard",
        subtag: "Top 5 by Media",
        subtitle: "Tap to view growth factors & viral drivers",
        home: "Home",
        filterAll: "Overall",
        filterYt: "YouTube",
        filterTt: "TikTok",
        filterTh: "Threads",
        filterIg: "Instagram",
        filterX: "X",
        statFollowers: "Total Audience",
        statGrowth: "Weekly Gain",
        viralKeyword: "Viral Topic",
        reasonTitle: "💡 Growth Factor:",
        voteAcknowledge: "🔥 Deserved",
        voteHype: "🤔 Pure Hype",
        votedBadge: "Voted",
        footerNote: "Aggregated based on weekly engagement surges and follower velocity.",
        loadError: "Failed to load data."
      }
    };

    function updateUiLabels() {
      const t = I18N[currentLang];
      document.getElementById('ui-subname').innerText = t.subname;
      document.getElementById('ui-subtag').innerText = t.subtag;
      document.getElementById('ui-subtitle').innerText = t.subtitle;
      document.getElementById('ui-home').innerText = t.home;
      document.getElementById('filter-all').innerText = t.filterAll;
      document.getElementById('filter-yt').innerText = t.filterYt;
      document.getElementById('filter-tt').innerText = t.filterTt;
      document.getElementById('filter-th').innerText = t.filterTh;
      document.getElementById('filter-ig').innerText = t.filterIg;
      document.getElementById('filter-x').innerText = t.filterX;
      document.getElementById('ui-footer-note').innerText = t.footerNote;

      const btnKo = document.getElementById('btn-ko');
      const btnEn = document.getElementById('btn-en');
      if (currentLang === 'ko') {
        btnKo.className = "px-2 py-0.5 rounded bg-amber-500 text-black font-extrabold transition";
        btnEn.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      } else {
        btnEn.className = "px-2 py-0.5 rounded bg-amber-500 text-black font-extrabold transition";
        btnKo.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      }
    }

    function toggleExpand(id) {
      expandedId = expandedId === id ? null : id;
      renderLeaderboard(currentFilter);
    }

    function renderLeaderboard(filter = 'ALL') {
      const container = document.getElementById('leaderboard-container');
      container.innerHTML = '';
      const t = I18N[currentLang];

      let filtered = [];
      if (filter === 'ALL') {
        // 종합 순위는 전체 25개 중 주간 성장률/지표 기준 상위 10개 노출
        filtered = [...RANKS].sort((a, b) => a.overallRank - b.overallRank).slice(0, 10);
      } else {
        // 매체별 선택 시 해당 매체의 1위부터 5위까지 정렬
        filtered = RANKS.filter(item => item.platform === filter).sort((a, b) => a.platformRank - b.platformRank);
      }

      filtered.forEach(item => {
        const displayRank = filter === 'ALL' ? item.overallRank : item.platformRank;
        const isExpanded = expandedId === item.id;
        const votedKey = `rank_voted_${item.id}`;
        const userVoted = localStorage.getItem(votedKey);

        let rankMedal = '';
        if (displayRank === 1) rankMedal = '<span class="text-base">🥇</span>';
        else if (displayRank === 2) rankMedal = '<span class="text-base">🥈</span>';
        else if (displayRank === 3) rankMedal = '<span class="text-base">🥉</span>';
        else rankMedal = `<span class="font-mono font-black text-slate-400 text-xs w-5 text-center">#${displayRank}</span>`;

        const row = document.createElement('div');
        row.className = `border rounded-2xl transition overflow-hidden shadow-md ${isExpanded ? 'bg-[#161b22] border-amber-500/50' : 'bg-[#161b22]/70 border-slate-800 hover:border-slate-700'}`;

        row.innerHTML = `
          <!-- 테이블 요약 행 (터치 시 전개) -->
          <div onclick="toggleExpand('${item.id}')" class="p-3 flex items-center justify-between cursor-pointer select-none">
            <div class="flex items-center gap-2.5 min-w-0 pr-2">
              <div class="shrink-0 w-6 flex items-center justify-center">${rankMedal}</div>
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 truncate">
                  <span class="font-extrabold text-white text-xs truncate">${item.creatorName[currentLang]}</span>
                  <span class="text-[9px] font-mono px-1 py-0.2 rounded border ${item.platformColor} shrink-0">${item.platformBadge}</span>
                </div>
                <div class="text-[10px] text-slate-400 font-mono truncate">
                  <span>${item.handle}</span> · <span>${item.categoryTag[currentLang]}</span>
                </div>
              </div>
            </div>

            <div class="flex items-center gap-3 shrink-0 text-right">
              <div>
                <span class="text-emerald-400 font-mono font-black text-xs block">${item.weeklyGrowth[currentLang]}</span>
                <span class="text-[10px] text-slate-500 font-mono block">${item.followers[currentLang]}</span>
              </div>
              <span class="text-slate-500 text-xs transition-transform duration-200 ${isExpanded ? 'rotate-180 text-amber-400' : ''}">▼</span>
            </div>
          </div>

          <!-- 아코디언 전개 영역 -->
          ${isExpanded ? `
            <div class="p-3.5 pt-1 space-y-2.5 border-t border-slate-800/80 bg-slate-950/40 text-xs">
              <!-- 헤드라인 박스 -->
              <div class="space-y-1">
                <div class="flex items-center justify-between text-[10px] font-mono">
                  <span class="text-amber-400 font-bold">${item.viralTopic}</span>
                  <span class="text-slate-400 font-bold bg-slate-800 px-1.5 py-0.5 rounded">${item.rankChange}</span>
                </div>
                <p class="font-bold text-slate-100 leading-snug">
                  ${item.headline[currentLang]}
                </p>
              </div>

              <!-- 떡상 포인트 박스 -->
              <div class="bg-gradient-to-r from-amber-950/20 to-orange-950/10 border border-amber-500/20 rounded-xl p-2.5">
                <p class="text-xs text-amber-200/90 leading-relaxed">
                  <strong class="text-amber-400 font-extrabold mr-1 whitespace-nowrap">${t.reasonTitle}</strong>${item.growthFactor[currentLang]}
                </p>
              </div>

              <!-- 1클릭 투표 바 -->
              <div class="pt-1 flex items-center justify-between gap-2 border-t border-slate-800/60 text-xs">
                <div class="flex items-center gap-1.5 flex-1">
                  <button onclick="toggleVote('${item.id}', 'up')" class="flex-1 py-1.5 px-2 rounded-lg border transition whitespace-nowrap active:scale-95 ${userVoted === 'up' ? 'bg-amber-500 border-amber-500 text-black font-extrabold' : 'border-slate-700 bg-slate-800 text-slate-300'}">
                    <span>${t.voteAcknowledge}</span>
                    <span class="font-mono font-bold ml-1">${item.upvotes + (userVoted === 'up' ? 1 : 0)}</span>
                  </button>
                  <button onclick="toggleVote('${item.id}', 'down')" class="flex-1 py-1.5 px-2 rounded-lg border transition whitespace-nowrap active:scale-95 ${userVoted === 'down' ? 'bg-slate-700 border-slate-500 text-white font-bold' : 'border-slate-700 bg-slate-800 text-slate-400'}">
                    <span>${t.voteHype}</span>
                    <span class="font-mono ml-1">${item.disagrees + (userVoted === 'down' ? 1 : 0)}</span>
                  </button>
                </div>
                <span class="text-[10px] font-mono whitespace-nowrap ${userVoted ? 'text-amber-400 font-bold' : 'text-slate-500'}">
                  ${userVoted ? '✓ ' + t.votedBadge : ''}
                </span>
              </div>
            </div>
          ` : ''}
        `;
        container.appendChild(row);
      });
    }

    function toggleVote(id, type) {
      const votedKey = `rank_voted_${id}`;
      const prev = localStorage.getItem(votedKey);

      if (prev === type) {
        localStorage.removeItem(votedKey);
      } else {
        localStorage.setItem(votedKey, type);
      }
      renderLeaderboard(currentFilter);
    }

    function filterType(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "filter-btn active px-3 py-1 rounded-lg bg-amber-500 text-black font-extrabold transition whitespace-nowrap";
        } else {
          btn.className = "filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition whitespace-nowrap";
        }
      });
      renderLeaderboard(type);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('user_lang', lang);
      document.documentElement.lang = lang;
      updateUiLabels();
      renderLeaderboard(currentFilter);
    }

    const savedLang = localStorage.getItem('user_lang');
    if (savedLang) {
      currentLang = savedLang;
    } else if (!navigator.language.startsWith('ko')) {
      currentLang = 'en';
    }

    document.documentElement.lang = currentLang;
    updateUiLabels();

    fetch('./posts.json')
      .then(res => res.json())
      .then(data => {
        RANKS = data.ranks;
        const first = [...RANKS].sort((a, b) => a.overallRank - b.overallRank)[0];
        expandedId = first ? first.id : null;
        renderLeaderboard(currentFilter);
      })
      .catch(err => {
        console.error('Failed to load posts.json', err);
        document.getElementById('leaderboard-container').innerHTML =
          `<p class="text-center text-slate-500 py-10 text-sm">${I18N[currentLang].loadError}</p>`;
      });
  </script>
</body>
</html>
