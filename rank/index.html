      const btnEn = document.getElementById('btn-en');

        btnEn.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";

            </div>
          </div>

          <!-- 4. 1클릭 토글 인터랙션 바 -->
          <div class="px-4 py-2.5 bg-slate-900/60 border-t border-slate-800/80 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
              <button onclick="toggleVote('${item.id}', 'up')" class="vote-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition whitespace-nowrap active:scale-95 ${userVoted === 'up' ? 'bg-amber-500 border-amber-500 text-black font-extrabold shadow-md shadow-amber-500/30' : 'border-slate-700 bg-slate-800/80 text-slate-300 hover:border-amber-500 hover:text-amber-400'}">
                <span>${t.voteAcknowledge}</span>
                <span class="font-mono font-bold">${item.upvotes + (userVoted === 'up' ? 1 : 0)}</span>
              </button>
              <button onclick="toggleVote('${item.id}', 'down')" class="vote-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition whitespace-nowrap active:scale-95 ${userVoted === 'down' ? 'bg-slate-700 border-slate-500 text-white font-bold' : 'border-slate-700 bg-slate-800/80 text-slate-400 hover:border-slate-500 hover:text-slate-200'}">
                <span>${t.voteHype}</span>
                <span class="font-mono">${item.disagrees + (userVoted === 'down' ? 1 : 0)}</span>
              </button>
            </div>
            <span class="text-[11px] font-mono whitespace-nowrap ${userVoted ? 'text-amber-400 font-bold' : 'text-slate-500'}">
              ${userVoted ? '✓ ' + t.votedBadge : ''}
            </span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleVote(id, type) {
      const votedKey = `rank_voted_${id}`;
      const prev = localStorage.getItem(votedKey);

      if (prev === type) {
        localStorage.removeItem(votedKey);
      } else {
        localStorage.setItem(votedKey, type);
      }
      renderFeed(currentFilter);
    }

    function filterType(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "filter-btn active px-3 py-1 rounded-lg bg-amber-500 text-black font-extrabold transition whitespace-nowrap";
        } else {
          btn.className = "filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition whitespace-nowrap";
        }
      });
      renderFeed(type);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('user_lang', lang);
      document.documentElement.lang = lang;
      updateUiLabels();
      renderFeed(currentFilter);
    }

    const savedLang = localStorage.getItem('user_lang');
    if (savedLang) {
      currentLang = savedLang;
    } else if (!navigator.language.startsWith('ko')) {
      currentLang = 'en';
    }

    document.documentElement.lang = currentLang;
    updateUiLabels();
    renderFeed();
  </script>
</body>
</html>
