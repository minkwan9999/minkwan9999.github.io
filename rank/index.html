    function updateUiLabels() {
      const t = I18N[currentLang];
      document.getElementById('ui-subname').innerText = t.subname;
      document.getElementById('ui-subtag').innerText = t.subtag;
      document.getElementById('ui-subtitle').innerText = t.subtitle;
      document.getElementById('ui-home').innerText = t.home;
      document.getElementById('filter-all').innerText = t.filterAll;
      document.getElementById('filter-yt').innerText = t.filterYt;
      document.getElementById('filter-tt').innerText = t.filterTt;
      document.getElementById('filter-th').innerText = t.filterTh;
      document.getElementById('filter-ig').innerText = t.filterIg;
      document.getElementById('filter-x').innerText = t.filterX;
      document.getElementById('ui-footer-note').innerText = t.footerNote;

      const btnKo = document.getElementById('btn-ko');
      const btnEn = document.getElementById('btn-en');
      if (currentLang === 'ko') {
        btnKo.className = "px-2 py-0.5 rounded bg-amber-500 text-black font-extrabold transition";
        btnEn.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      } else {
        btnEn.className = "px-2 py-0.5 rounded bg-amber-500 text-black font-extrabold transition";
        btnKo.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      }
    }

    function toggleExpand(id) {
      expandedId = expandedId === id ? null : id;
      renderLeaderboard(currentFilter);
    }

    function renderLeaderboard(filter = 'ALL') {
      const container = document.getElementById('leaderboard-container');
      container.innerHTML = '';
      const t = I18N[currentLang];

      const filtered = filter === 'ALL' ? RANKS : RANKS.filter(item => item.platform === filter);

      filtered.forEach(item => {
        const isExpanded = expandedId === item.id;
        const votedKey = `rank_voted_${item.id}`;
        const userVoted = localStorage.getItem(votedKey);

        let rankMedal = '';
        if (item.rank === 1) rankMedal = '<span class="text-base">🥇</span>';
        else if (item.rank === 2) rankMedal = '<span class="text-base">🥈</span>';
        else if (item.rank === 3) rankMedal = '<span class="text-base">🥉</span>';
        else rankMedal = `<span class="font-mono font-black text-slate-400 text-xs w-5 text-center">#${item.rank}</span>`;

        const row = document.createElement('div');
        row.className = `border rounded-2xl transition overflow-hidden shadow-md ${isExpanded ? 'bg-[#161b22] border-amber-500/50' : 'bg-[#161b22]/70 border-slate-800 hover:border-slate-700'}`;

        row.innerHTML = `
          <!-- 테이블 요약 행 (항상 노출, 터치 가능) -->
          <div onclick="toggleExpand('${item.id}')" class="p-3 flex items-center justify-between cursor-pointer select-none">
            <div class="flex items-center gap-2.5 min-w-0 pr-2">
              <div class="shrink-0 w-6 flex items-center justify-center">${rankMedal}</div>
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 truncate">
                  <span class="font-extrabold text-white text-xs truncate">${item.creatorName[currentLang]}</span>
                  <span class="text-[9px] font-mono px-1 py-0.2 rounded border ${item.platformColor} shrink-0">${item.platformBadge}</span>
                </div>
                <div class="text-[10px] text-slate-400 font-mono truncate">
                  <span>${item.handle}</span> · <span>${item.categoryTag[currentLang]}</span>
                </div>
              </div>
            </div>

            <div class="flex items-center gap-3 shrink-0 text-right">
              <div>
                <span class="text-emerald-400 font-mono font-black text-xs block">${item.weeklyGrowth[currentLang]}</span>
                <span class="text-[10px] text-slate-500 font-mono block">${item.followers[currentLang]}</span>
              </div>
              <span class="text-slate-500 text-xs transition-transform duration-200 ${isExpanded ? 'rotate-180 text-amber-400' : ''}">▼</span>
            </div>
          </div>

          <!-- 아코디언 확장 영역 (터치 시 전개) -->
          ${isExpanded ? `
            <div class="p-3.5 pt-1 space-y-2.5 border-t border-slate-800/80 bg-slate-950/40 text-xs animate-fadeIn">
              <!-- 헤드라인 박스 -->
              <div class="space-y-1">
                <div class="flex items-center justify-between text-[10px] font-mono">
                  <span class="text-amber-400 font-bold">${item.viralTopic}</span>
                  <span class="text-slate-400 font-bold bg-slate-800 px-1.5 py-0.5 rounded">${item.rankChange}</span>
                </div>
                <p class="font-bold text-slate-100 leading-snug">
                  ${item.headline[currentLang]}
                </p>
              </div>

              <!-- 떡상 포인트 박스 -->
              <div class="bg-gradient-to-r from-amber-950/20 to-orange-950/10 border border-amber-500/20 rounded-xl p-2.5">
                <p class="text-xs text-amber-200/90 leading-relaxed">
                  <strong class="text-amber-400 font-extrabold mr-1 whitespace-nowrap">${t.reasonTitle}</strong>${item.growthFactor[currentLang]}
                </p>
              </div>

              <!-- 투표 바 -->
              <div class="pt-1 flex items-center justify-between gap-2 border-t border-slate-800/60 text-xs">
                <div class="flex items-center gap-1.5 flex-1">
                  <button onclick="toggleVote('${item.id}', 'up')" class="flex-1 py-1.5 px-2 rounded-lg border transition whitespace-nowrap active:scale-95 ${userVoted === 'up' ? 'bg-amber-500 border-amber-500 text-black font-extrabold' : 'border-slate-700 bg-slate-800 text-slate-300'}">
                    <span>${t.voteAcknowledge}</span>
                    <span class="font-mono font-bold ml-1">${item.upvotes + (userVoted === 'up' ? 1 : 0)}</span>
                  </button>
                  <button onclick="toggleVote('${item.id}', 'down')" class="flex-1 py-1.5 px-2 rounded-lg border transition whitespace-nowrap active:scale-95 ${userVoted === 'down' ? 'bg-slate-700 border-slate-500 text-white font-bold' : 'border-slate-700 bg-slate-800 text-slate-400'}">
                    <span>${t.voteHype}</span>
                    <span class="font-mono ml-1">${item.disagrees + (userVoted === 'down' ? 1 : 0)}</span>
                  </button>
                </div>
                <span class="text-[10px] font-mono whitespace-nowrap ${userVoted ? 'text-amber-400 font-bold' : 'text-slate-500'}">
                  ${userVoted ? '✓ ' + t.votedBadge : ''}
                </span>
              </div>
            </div>
          ` : ''}
        `;
        container.appendChild(row);
      });
    }

    function toggleVote(id, type) {
      const votedKey = `rank_voted_${id}`;
      const prev = localStorage.getItem(votedKey);

      if (prev === type) {
        localStorage.removeItem(votedKey);
      } else {
        localStorage.setItem(votedKey, type);
      }
      renderLeaderboard(currentFilter);
    }

    function filterType(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "filter-btn active px-3 py-1 rounded-lg bg-amber-500 text-black font-extrabold transition whitespace-nowrap";
        } else {
          btn.className = "filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition whitespace-nowrap";
        }
      });
      renderLeaderboard(type);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('user_lang', lang);
      document.documentElement.lang = lang;
      updateUiLabels();
      renderLeaderboard(currentFilter);
    }

    const savedLang = localStorage.getItem('user_lang');
    if (savedLang) {
      currentLang = savedLang;
    } else if (!navigator.language.startsWith('ko')) {
      currentLang = 'en';
    }

    document.documentElement.lang = currentLang;
    updateUiLabels();
    renderLeaderboard();
  </script>
</body>
</html>
