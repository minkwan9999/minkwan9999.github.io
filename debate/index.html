          label: { ko: "금융 문맹의 파멸 (자산 단절)", en: "Financial Ruin (Zero Compounding)" },
          reasons: {
            ko: ["감가상각이 가장 빠른 소모품에 월급의 30% 이상을 묶는 순간 복리의 기회는 영원히 박탈됨", "할부금 외에도 보험료, 고급유, 취등록세, 소모품 교체비로 월 150만원 이상이 녹아내림", "겉멋에 취해 시드머니를 못 모은 대가는 30대 후반 결혼 및 주거 위기 때 재앙으로 돌아옴"],
            en: ["Locking 30%+ of income into a rapidly depreciating asset kills compounding.", "Insurance, maintenance, and taxes quietly drain over 50% of take-home pay.", "Failing to build a seed fund leads to a brutal crisis in your late 30s."]
          }
        },
        practicalVerdict: {
          ko: "자산 형성기인 30대 초반 월급의 30% 이상을 차량 유지비로 쓰는 것은 '부의 사다리 걷어차기'라는 것이 금융권의 일치된 결론. 차량 가액은 연봉의 40% 이내가 안전선입니다.",
          en: "Financial planners unanimously agree that spending over 30% of income on car expenses destroys wealth accumulation. Vehicle cost should never exceed 40% of annual salary."
        },
        votesA: 310,
        votesB: 845
      }
    ];

    function updateUiLabels() {
      const t = I18N[currentLang];
      document.getElementById('ui-subname').innerText = t.subname;
      document.getElementById('ui-subtag').innerText = t.subtag;
      document.getElementById('ui-subtitle').innerText = t.subtitle;
      document.getElementById('ui-home').innerText = t.home;
      document.getElementById('filter-all').innerText = t.filterAll;
      document.getElementById('filter-work').innerText = t.filterWork;
      document.getElementById('filter-relation').innerText = t.filterRelation;
      document.getElementById('filter-life').innerText = t.filterLife;
      document.getElementById('ui-footer-note').innerText = t.footerNote;

      const btnKo = document.getElementById('btn-ko');
      const btnEn = document.getElementById('btn-en');
      if (currentLang === 'ko') {
        btnKo.className = "px-2 py-0.5 rounded bg-violet-500 text-white transition";
        btnEn.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      } else {
        btnEn.className = "px-2 py-0.5 rounded bg-violet-500 text-white transition";
        btnKo.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      }
    }

    function renderFeed(filter = 'ALL') {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';
      const t = I18N[currentLang];

      const filtered = filter === 'ALL' ? POSTS : POSTS.filter(item => item.cardType === filter);

      filtered.forEach(item => {
        const votedKey = `debate_voted_${item.id}`;
        const userVoted = localStorage.getItem(votedKey);

        const vA = item.votesA + (userVoted === 'A' ? 1 : 0);
        const vB = item.votesB + (userVoted === 'B' ? 1 : 0);
        const total = vA + vB;
        const pctA = Math.round((vA / total) * 100);
        const pctB = 100 - pctA;

        const card = document.createElement('article');
        card.className = "bg-[#161b22] border border-slate-800 rounded-2xl overflow-hidden shadow-xl";

        card.innerHTML = `
          <!-- 1. 헤더 -->
          <div class="p-3 pb-2 flex items-center justify-between border-b border-slate-800/60 bg-slate-900/40 text-xs">
            <div class="flex items-center gap-1.5 min-w-0 pr-2">
              <span class="text-base shrink-0">${item.avatar}</span>
              <span class="font-bold text-slate-200 truncate">${item.tag[currentLang]}</span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0 whitespace-nowrap">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${item.statusColor}">
                ${item.statusBadge[currentLang]}
              </span>
            </div>
          </div>

          <!-- 2. 보도/상황 사진 아카이브 -->
          <div class="relative w-full h-40 bg-slate-950 overflow-hidden border-b border-slate-800">
            <img src="${item.imageBeforeUrl}" alt="${item.title[currentLang]}" class="w-full h-full object-cover object-center filter grayscale contrast-110 hover:grayscale-0 transition duration-500" loading="lazy">
            <div class="absolute inset-0 bg-gradient-to-t from-[#161b22] via-transparent to-black/30"></div>
            <span class="absolute bottom-2 left-3 text-[10px] font-mono text-slate-300 bg-black/60 px-2 py-0.5 rounded backdrop-blur border border-white/10 truncate max-w-[85%]">
              📷 ${item.imageCaption[currentLang]}
            </span>
          </div>

          <!-- 3. 카드 본문 -->
          <div class="p-4 space-y-3">
            <h2 class="text-base font-extrabold text-white leading-snug tracking-tight">
              ${item.title[currentLang]}
            </h2>

            <!-- 발단 맥락 박스 -->
            <div class="bg-[#1c2128] border-l-4 border-violet-500/80 rounded-r-xl p-3 space-y-1 shadow-inner">
              <div class="text-[11px] text-violet-400 font-mono font-bold whitespace-nowrap">
                ${t.contextLabel}
              </div>
              <p class="text-xs text-slate-300 leading-relaxed font-normal">
                ${item.contextText[currentLang]}
              </p>
            </div>

            <!-- 양측 핵심 논리 2단 박스 -->
            <div class="grid grid-cols-1 gap-2 pt-1">
              <!-- A 진영 -->
              <div class="bg-[#0e1117] border border-blue-900/40 rounded-xl p-3 space-y-1.5">
                <div class="flex items-center justify-between text-xs font-bold text-blue-400">
                  <span>🔵 ${item.sideA.label[currentLang]}</span>
                  <span class="font-mono text-[11px]">${pctA}%</span>
                </div>
                <ul class="text-[11px] text-slate-300 space-y-1 list-disc list-inside">
                  ${item.sideA.reasons[currentLang].map(r => `<li class="leading-relaxed">${r}</li>`).join('')}
                </ul>
              </div>

              <!-- B 진영 -->
              <div class="bg-[#0e1117] border border-rose-900/40 rounded-xl p-3 space-y-1.5">
                <div class="flex items-center justify-between text-xs font-bold text-rose-400">
                  <span>🔴 ${item.sideB.label[currentLang]}</span>
                  <span class="font-mono text-[11px]">${pctB}%</span>
                </div>
                <ul class="text-[11px] text-slate-300 space-y-1 list-disc list-inside">
                  ${item.sideB.reasons[currentLang].map(r => `<li class="leading-relaxed">${r}</li>`).join('')}
                </ul>
              </div>
            </div>

            <!-- 현실 종결 기준 박스 -->
            <div class="bg-gradient-to-r from-violet-950/20 to-indigo-950/10 border border-violet-500/20 rounded-xl p-2.5">
              <p class="text-xs text-violet-200/90 leading-relaxed">
                <strong class="text-violet-400 font-extrabold mr-1 whitespace-nowrap">${t.ruleTitle}</strong>${item.practicalVerdict[currentLang]}
              </p>
            </div>
          </div>

          <!-- 4. 실시간 양자택일 투표 인터랙션 바 -->
          <div class="px-4 py-3 bg-slate-900/60 border-t border-slate-800/80 space-y-2">
            <!-- 투표 게이지 바 -->
            <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden flex">
              <div style="width: ${pctA}%" class="bg-blue-500 transition-all duration-500"></div>
              <div style="width: ${pctB}%" class="bg-rose-500 transition-all duration-500"></div>
            </div>

            <!-- 투표 버튼 2지선다 -->
            <div class="flex items-center justify-between gap-2 text-xs pt-1">
              <button onclick="toggleVote('${item.id}', 'A')" class="flex-1 py-1.5 px-2 rounded-lg border transition text-center truncate ${userVoted === 'A' ? 'bg-blue-600 border-blue-500 text-white font-bold shadow-md shadow-blue-500/30' : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-blue-500 hover:text-blue-400'}">
                <span>🔵 ${item.sideA.label[currentLang]}</span>
              </button>
              <button onclick="toggleVote('${item.id}', 'B')" class="flex-1 py-1.5 px-2 rounded-lg border transition text-center truncate ${userVoted === 'B' ? 'bg-rose-600 border-rose-500 text-white font-bold shadow-md shadow-rose-500/30' : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-rose-500 hover:text-rose-400'}">
                <span>🔴 ${item.sideB.label[currentLang]}</span>
              </button>
            </div>
            ${userVoted ? `<div class="text-center text-[10px] font-mono text-violet-400">✓ ${t.votedBadge}</div>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleVote(id, type) {
      const votedKey = `debate_voted_${id}`;
      const prev = localStorage.getItem(votedKey);

      if (prev === type) {
        localStorage.removeItem(votedKey);
      } else {
        localStorage.setItem(votedKey, type);
      }
      renderFeed(currentFilter);
    }

    function filterType(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "filter-btn active px-3 py-1 rounded-lg bg-violet-500 text-white font-bold transition whitespace-nowrap";
        } else {
          btn.className = "filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition whitespace-nowrap";
        }
      });
      renderFeed(type);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('user_lang', lang);
      document.documentElement.lang = lang;
      updateUiLabels();
      renderFeed(currentFilter);
    }

    const savedLang = localStorage.getItem('user_lang');
    if (savedLang) {
      currentLang = savedLang;
    } else if (!navigator.language.startsWith('ko')) {
      currentLang = 'en';
    }

    document.documentElement.lang = currentLang;
    updateUiLabels();
    renderFeed();
  </script>
</body>
</html>
