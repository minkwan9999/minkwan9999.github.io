<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인사이트랩 - 역대 논쟁 종결 백과 (The Great Debates)</title>
  <meta name="description" content="직장 AI 표기 논쟁부터 호텔 축의금, 전 애인 명품까지. 끝없는 말싸움의 양측 논리 3줄 요약과 실시간 판결 투표소.">
  <meta property="og:title" content="인사이트랩: 역대 논쟁 종결 백과">
  <meta property="og:description" content="대한민국을 반으로 가른 치열한 찬반 논쟁 요약 및 실시간 재투표">
  <script src="https://cdn.tailwindcss.com"></script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q543DWEBBW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-Q543DWEBBW');
</script>
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=pub-1957248819245044" crossorigin="anonymous"></script>

</head>
<body class="bg-[#0e1117] text-slate-200 antialiased min-h-screen py-5 px-3 flex flex-col items-center selection:bg-violet-500 selection:text-white">

  <main class="w-full max-w-md space-y-4">
    <!-- 상단 헤더 -->
    <header class="bg-[#161b22] border border-slate-800 rounded-2xl p-3.5 shadow-lg space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-violet-600 to-indigo-500 flex items-center justify-center font-black text-white text-sm shadow shrink-0">
            ⚖️
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold text-white text-sm tracking-tight truncate" id="ui-subname">논쟁 종결 백과</span>
              <span class="text-[10px] bg-violet-500/20 text-violet-400 font-bold px-1.5 py-0.5 rounded border border-violet-500/30 shrink-0" id="ui-subtag">실시간판결</span>
            </div>
            <p class="text-[11px] text-slate-400 truncate" id="ui-subtitle">양측 논리 3줄 요약 & 실시간 재투표</p>
          </div>
        </div>

        <!-- 언어 토글 & 홈 링크 -->
        <div class="flex items-center gap-1.5 shrink-0">
          <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg p-0.5 text-[11px] font-bold">
            <button onclick="setLang('ko')" id="btn-ko" class="px-2 py-0.5 rounded bg-violet-500 text-white transition">KO</button>
            <button onclick="setLang('en')" id="btn-en" class="px-2 py-0.5 rounded text-slate-400 hover:text-white transition">EN</button>
          </div>
          <a href="/" class="text-xs text-slate-400 hover:text-white px-1 whitespace-nowrap transition" id="ui-home">홈</a>
        </div>
      </div>

      <!-- 카테고리 필터 버튼 바 -->
      <div class="flex items-center gap-1.5 pt-2 border-t border-slate-800/80 text-xs font-semibold overflow-x-auto whitespace-nowrap">
        <button onclick="filterType('ALL')" class="filter-btn active px-3 py-1 rounded-lg bg-violet-500 text-white font-bold transition" data-type="ALL" id="filter-all">전체 논쟁</button>
        <button onclick="filterType('WORK')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="WORK" id="filter-work">직장·AI</button>
        <button onclick="filterType('RELATION')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="RELATION" id="filter-relation">인간관계·예절</button>
        <button onclick="filterType('LIFE')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="LIFE" id="filter-life">소비·라이프</button>
      </div>
    </header>

    <!-- 피드 리스트 컨테이너 -->
    <div id="feed-container" class="space-y-4">
      <p class="text-center text-slate-500 py-10 text-sm">불러오는 중...</p>
    </div>

    <!-- 하단 푸터 -->
    <footer class="pt-4 pb-6 text-center text-xs text-slate-500 space-y-1">
      <p id="ui-footer-note">커뮤니티 및 여론조사 빅데이터를 기반으로 찬반 논리를 재구성했습니다.</p>
      <p>© 2026 인사이트랩 (InsightLab) · The Great Debates Edition</p>
    </footer>
  </main>

  <script>
    let currentLang = 'ko';
    let currentFilter = 'ALL';
    let POSTS = [];
    let expandedId = null;

    const NEW_BADGE_DAYS = 3;
    function isNewItem(item) {
      if (!item.addedAt) return false;
      const addedMs = new Date(item.addedAt).getTime();
      if (isNaN(addedMs)) return false;
      const daysSince = (Date.now() - addedMs) / 86400000;
      return daysSince >= 0 && daysSince <= NEW_BADGE_DAYS;
    }

    const I18N = {
      ko: {
        subname: "논쟁 종결 백과",
        subtag: "실시간판결",
        subtitle: "양측 논리 3줄 요약 & 실시간 재투표",
        home: "홈",
        filterAll: "전체 논쟁",
        filterWork: "직장·AI",
        filterRelation: "인간관계·예절",
        filterLife: "소비·라이프",
        contextLabel: "🔥 논쟁 발단 및 쟁점",
        ruleTitle: "⚖️ 현실 여론 & 암묵적 합의선:",
        votedBadge: "판결 참여 완료",
        newBadge: "NEW",
        footerNote: "커뮤니티 및 여론조사 빅데이터를 기반으로 찬반 논리를 재구성했습니다.",
        loadError: "데이터를 불러오지 못했습니다."
      },
      en: {
        subname: "Great Debates",
        subtag: "Live Verdict",
        subtitle: "Both sides summarized in 3 lines & Live Voting",
        home: "Home",
        filterAll: "All Debates",
        filterWork: "Work & AI",
        filterRelation: "Relationships",
        filterLife: "Money & Life",
        contextLabel: "🔥 What Sparked The Debate",
        ruleTitle: "⚖️ Public Consensus & Practical Standard:",
        votedBadge: "Vote Recorded",
        newBadge: "NEW",
        footerNote: "Compiled based on viral community discourse and polling datasets.",
        loadError: "Failed to load data."
      }
    };

    function updateUiLabels() {
      const t = I18N[currentLang];
      document.getElementById('ui-subname').innerText = t.subname;
      document.getElementById('ui-subtag').innerText = t.subtag;
      document.getElementById('ui-subtitle').innerText = t.subtitle;
      document.getElementById('ui-home').innerText = t.home;
      document.getElementById('filter-all').innerText = t.filterAll;
      document.getElementById('filter-work').innerText = t.filterWork;
      document.getElementById('filter-relation').innerText = t.filterRelation;
      document.getElementById('filter-life').innerText = t.filterLife;
      document.getElementById('ui-footer-note').innerText = t.footerNote;

      const btnKo = document.getElementById('btn-ko');
      const btnEn = document.getElementById('btn-en');
      if (currentLang === 'ko') {
        btnKo.className = "px-2 py-0.5 rounded bg-violet-500 text-white transition";
        btnEn.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      } else {
        btnEn.className = "px-2 py-0.5 rounded bg-violet-500 text-white transition";
        btnKo.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      }
    }

    function toggleExpand(id) {
      expandedId = expandedId === id ? null : id;
      renderFeed(currentFilter);
    }

    function renderFeed(filter = 'ALL') {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';
      const t = I18N[currentLang];

      const filtered = filter === 'ALL' ? POSTS : POSTS.filter(item => item.cardType === filter);

      filtered.forEach(item => {
        const votedKey = `debate_voted_${item.id}`;
        const userVoted = localStorage.getItem(votedKey);
        const isExpanded = expandedId === item.id;
        const isNew = isNewItem(item);

        const vA = item.votesA + (userVoted === 'A' ? 1 : 0);
        const vB = item.votesB + (userVoted === 'B' ? 1 : 0);
        const total = vA + vB;
        const pctA = Math.round((vA / total) * 100);
        const pctB = 100 - pctA;

        const card = document.createElement('article');
        card.className = `border rounded-2xl overflow-hidden shadow-xl transition ${isExpanded ? 'bg-[#161b22] border-violet-500/50' : 'bg-[#161b22]/80 border-slate-800 hover:border-slate-700'}`;

        card.innerHTML = `
          <!-- 요약 행 (탭하면 펼쳐짐) -->
          <div onclick="toggleExpand('${item.id}')" class="p-3 flex items-center gap-2 cursor-pointer select-none">
            <span class="text-lg shrink-0">${item.avatar}</span>
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 flex-wrap mb-0.5">
                <span class="text-[10px] font-mono text-slate-400">${item.tag[currentLang]}</span>
                ${isNew ? `<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-rose-500 text-white shrink-0 animate-pulse">${t.newBadge}</span>` : ''}
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border whitespace-nowrap ${item.statusColor}">${item.statusBadge[currentLang]}</span>
              </div>
              <h2 class="text-sm font-extrabold text-white leading-snug ${isExpanded ? '' : 'line-clamp-2'}">${item.title[currentLang]}</h2>
            </div>
            <span class="text-slate-500 text-xs shrink-0 transition-transform duration-200 ${isExpanded ? 'rotate-180 text-violet-400' : ''}">▼</span>
          </div>

          ${isExpanded ? `
          <div class="border-t border-slate-800/80">
            <!-- 보도/상황 사진 아카이브 -->
            <div class="relative w-full h-40 bg-slate-950 overflow-hidden border-b border-slate-800">
              <img src="${item.imageBeforeUrl}" alt="${item.title[currentLang]}" class="w-full h-full object-cover object-center filter grayscale contrast-110 hover:grayscale-0 transition duration-500" loading="lazy">
              <div class="absolute inset-0 bg-gradient-to-t from-[#161b22] via-transparent to-black/30"></div>
              <span class="absolute bottom-2 left-3 text-[10px] font-mono text-slate-300 bg-black/60 px-2 py-0.5 rounded backdrop-blur border border-white/10 truncate max-w-[85%]">
                📷 ${item.imageCaption[currentLang]}
              </span>
            </div>

            <div class="p-4 space-y-3">
              <!-- 발단 맥락 박스 -->
              <div class="bg-[#1c2128] border-l-4 border-violet-500/80 rounded-r-xl p-3 space-y-1 shadow-inner">
                <div class="text-[11px] text-violet-400 font-mono font-bold whitespace-nowrap">
                  ${t.contextLabel}
                </div>
                <p class="text-xs text-slate-300 leading-relaxed font-normal">
                  ${item.contextText[currentLang]}
                </p>
              </div>

              <!-- 양측 핵심 논리 2단 박스 -->
              <div class="grid grid-cols-1 gap-2 pt-1">
                <div class="bg-[#0e1117] border border-blue-900/40 rounded-xl p-3 space-y-1.5">
                  <div class="flex items-center justify-between text-xs font-bold text-blue-400">
                    <span>🔵 ${item.sideA.label[currentLang]}</span>
                    <span class="font-mono text-[11px]">${pctA}%</span>
                  </div>
                  <ul class="text-[11px] text-slate-300 space-y-1 list-disc list-inside">
                    ${item.sideA.reasons[currentLang].map(r => `<li class="leading-relaxed">${r}</li>`).join('')}
                  </ul>
                </div>

                <div class="bg-[#0e1117] border border-rose-900/40 rounded-xl p-3 space-y-1.5">
                  <div class="flex items-center justify-between text-xs font-bold text-rose-400">
                    <span>🔴 ${item.sideB.label[currentLang]}</span>
                    <span class="font-mono text-[11px]">${pctB}%</span>
                  </div>
                  <ul class="text-[11px] text-slate-300 space-y-1 list-disc list-inside">
                    ${item.sideB.reasons[currentLang].map(r => `<li class="leading-relaxed">${r}</li>`).join('')}
                  </ul>
                </div>
              </div>

              <!-- 현실 종결 기준 박스 -->
              <div class="bg-gradient-to-r from-violet-950/20 to-indigo-950/10 border border-violet-500/20 rounded-xl p-2.5">
                <p class="text-xs text-violet-200/90 leading-relaxed">
                  <strong class="text-violet-400 font-extrabold mr-1 whitespace-nowrap">${t.ruleTitle}</strong>${item.practicalVerdict[currentLang]}
                </p>
              </div>
            </div>

            <!-- 실시간 양자택일 투표 인터랙션 바 -->
            <div class="px-4 py-3 bg-slate-900/60 border-t border-slate-800/80 space-y-2">
              <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden flex">
                <div style="width: ${pctA}%" class="bg-blue-500 transition-all duration-500"></div>
                <div style="width: ${pctB}%" class="bg-rose-500 transition-all duration-500"></div>
              </div>

              <div class="flex items-center justify-between gap-2 text-xs pt-1">
                <button onclick="event.stopPropagation(); toggleVote('${item.id}', 'A')" class="flex-1 py-1.5 px-2 rounded-lg border transition text-center truncate ${userVoted === 'A' ? 'bg-blue-600 border-blue-500 text-white font-bold shadow-md shadow-blue-500/30' : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-blue-500 hover:text-blue-400'}">
                  <span>🔵 ${item.sideA.label[currentLang]}</span>
                </button>
                <button onclick="event.stopPropagation(); toggleVote('${item.id}', 'B')" class="flex-1 py-1.5 px-2 rounded-lg border transition text-center truncate ${userVoted === 'B' ? 'bg-rose-600 border-rose-500 text-white font-bold shadow-md shadow-rose-500/30' : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-rose-500 hover:text-rose-400'}">
                  <span>🔴 ${item.sideB.label[currentLang]}</span>
                </button>
              </div>
              ${userVoted ? `<div class="text-center text-[10px] font-mono text-violet-400">✓ ${t.votedBadge}</div>` : ''}
            </div>
          </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    function toggleVote(id, type) {
      const votedKey = `debate_voted_${id}`;
      const prev = localStorage.getItem(votedKey);

      if (prev === type) {
        localStorage.removeItem(votedKey);
      } else {
        localStorage.setItem(votedKey, type);
      }
      renderFeed(currentFilter);
    }

    function filterType(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "filter-btn active px-3 py-1 rounded-lg bg-violet-500 text-white font-bold transition whitespace-nowrap";
        } else {
          btn.className = "filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition whitespace-nowrap";
        }
      });
      renderFeed(type);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('user_lang', lang);
      document.documentElement.lang = lang;
      updateUiLabels();
      renderFeed(currentFilter);
    }

    const savedLang = localStorage.getItem('user_lang');
    if (savedLang) {
      currentLang = savedLang;
    } else if (!navigator.language.startsWith('ko')) {
      currentLang = 'en';
    }

    document.documentElement.lang = currentLang;
    updateUiLabels();

    fetch('./posts.json')
      .then(res => res.json())
      .then(data => {
        POSTS = [...data.posts].reverse();
        expandedId = POSTS.length ? POSTS[0].id : null;
        renderFeed(currentFilter);
      })
      .catch(err => {
        console.error('Failed to load posts.json', err);
        document.getElementById('feed-container').innerHTML =
          `<p class="text-center text-slate-500 py-10 text-sm">${I18N[currentLang].loadError}</p>`;
      });
  </script>
</body>
</html>
