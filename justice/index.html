<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인사이트랩 - 생활법률 판례 아카이브 (Legal Case Archive)</title>
  <meta name="description" content="실제 언론에 보도된 판결·기소 사례를 출처와 함께 정리한 생활법률 아카이브입니다.">
  <meta property="og:title" content="인사이트랩: 생활법률 판례 아카이브">
  <meta property="og:description" content="실제 보도된 사건과 판결 결과, 법적 대응 포인트를 정리합니다">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0e1117] text-slate-200 antialiased min-h-screen py-5 px-3 flex flex-col items-center selection:bg-cyan-500 selection:text-white">

  <main class="w-full max-w-md space-y-4">
    <!-- 상단 헤더 -->
    <header class="bg-[#161b22] border border-slate-800 rounded-2xl p-3.5 shadow-lg space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-600 to-blue-500 flex items-center justify-center font-black text-white text-sm shadow shrink-0">
            ⚖️
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold text-white text-sm tracking-tight truncate" id="ui-subname">생활법률 판례 아카이브</span>
              <span class="text-[10px] bg-cyan-500/20 text-cyan-400 font-bold px-1.5 py-0.5 rounded border border-cyan-500/30 shrink-0" id="ui-subtag">실화 보도 기반</span>
            </div>
            <p class="text-[11px] text-slate-400 truncate" id="ui-subtitle">실제 판결·기소 사례 & 법적 대응 포인트</p>
          </div>
        </div>

        <!-- 언어 토글 & 홈 링크 -->
        <div class="flex items-center gap-1.5 shrink-0">
          <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg p-0.5 text-[11px] font-bold">
            <button onclick="setLang('ko')" id="btn-ko" class="px-2 py-0.5 rounded bg-cyan-500 text-white transition">KO</button>
            <button onclick="setLang('en')" id="btn-en" class="px-2 py-0.5 rounded text-slate-400 hover:text-white transition">EN</button>
          </div>
          <a href="/" class="text-xs text-slate-400 hover:text-white px-1 whitespace-nowrap transition" id="ui-home">홈</a>
        </div>
      </div>

      <!-- 카테고리 탭 (진행형 포함 5개) -->
      <div class="flex items-center gap-1.5 pt-2 border-t border-slate-800/80 text-xs font-semibold overflow-x-auto whitespace-nowrap">
        <button onclick="filterType('ALL')" class="filter-btn active px-3 py-1 rounded-lg bg-cyan-500 text-white font-bold transition" data-type="ALL" id="filter-all">전체 피드</button>
        <button onclick="filterType('ONGOING')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="ONGOING" id="filter-ongoing">진행형 ⏳</button>
        <button onclick="filterType('PARKING')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="PARKING" id="filter-parking">주차·교통</button>
        <button onclick="filterType('WORK')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="WORK" id="filter-work">직장·갑질</button>
        <button onclick="filterType('COMMERCE')" class="filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition" data-type="COMMERCE" id="filter-commerce">사기·상거래</button>
      </div>
    </header>

    <!-- 피드 리스트 컨테이너 -->
    <div id="feed-container" class="space-y-4">
      <p class="text-center text-slate-500 py-10 text-sm">불러오는 중...</p>
    </div>

    <!-- 하단 푸터 -->
    <footer class="pt-4 pb-6 text-center text-xs text-slate-500 space-y-1">
      <p id="ui-footer-note">실제 언론 보도를 출처와 함께 정리한 아카이브입니다.</p>
      <p>© 2026 인사이트랩 (InsightLab) · Justice Served Edition</p>
    </footer>
  </main>

  <script>
    let currentLang = 'ko';
    let currentFilter = 'ALL';
    let POSTS = [];
    let expandedId = null;

    const NEW_BADGE_DAYS = 3;
    function isNewItem(item) {
      if (!item.addedAt) return false;
      const addedMs = new Date(item.addedAt).getTime();
      if (isNaN(addedMs)) return false;
      const daysSince = (Date.now() - addedMs) / 86400000;
      return daysSince >= 0 && daysSince <= NEW_BADGE_DAYS;
    }

    const I18N = {
      ko: {
        subname: "생활법률 판례 아카이브",
        subtag: "실화 보도 기반",
        subtitle: "실제 판결·기소 사례 & 법적 대응 포인트",
        home: "홈",
        filterAll: "전체 피드",
        filterOngoing: "진행형 ⏳",
        filterParking: "주차·교통",
        filterWork: "직장·갑질",
        filterCommerce: "사기·상거래",
        incidentLabel: "🚨 사건 개요",
        verdictTitleResolved: "⚖️ 판결·처분 결과",
        verdictTitleOngoing: "⏳ 수사·재판 진행 상황",
        takeawayTitle: "💡 실전 대처·법적 팁:",
        voteAwesome: "⚡ 참고가 됐어요",
        voteWeak: "🤔 처벌이 약하다고 봄",
        voteOngoingGuilty: "🔥 실형 예상",
        voteOngoingFlee: "🤔 가벼운 처벌 우려",
        votedBadge: "열람 완료",
        newBadge: "NEW",
        footerNote: "실제 언론 보도를 출처와 함께 정리한 아카이브입니다.",
        loadError: "데이터를 불러오지 못했습니다."
      },
      en: {
        subname: "Legal Case Archive",
        subtag: "Reported Cases",
        subtitle: "Real rulings & indictments, with practical legal takeaways",
        home: "Home",
        filterAll: "All Feeds",
        filterOngoing: "In Progress ⏳",
        filterParking: "Traffic & Parking",
        filterWork: "Workplace",
        filterCommerce: "Scams & Fraud",
        incidentLabel: "🚨 Case Summary",
        verdictTitleResolved: "⚖️ Ruling / Outcome",
        verdictTitleOngoing: "⏳ Current Legal Proceeding",
        takeawayTitle: "💡 Practical Legal Advice:",
        voteAwesome: "⚡ Found this useful",
        voteWeak: "🤔 Sentence too light",
        voteOngoingGuilty: "🔥 Expecting conviction",
        voteOngoingFlee: "🤔 Risk of light penalty",
        votedBadge: "Verified",
        newBadge: "NEW",
        footerNote: "Compiled based on verified news reports and legal precedent archives.",
        loadError: "Failed to load data."
      }
    };

    function updateUiLabels() {
      const t = I18N[currentLang];
      document.getElementById('ui-subname').innerText = t.subname;
      document.getElementById('ui-subtag').innerText = t.subtag;
      document.getElementById('ui-subtitle').innerText = t.subtitle;
      document.getElementById('ui-home').innerText = t.home;
      document.getElementById('filter-all').innerText = t.filterAll;
      document.getElementById('filter-ongoing').innerText = t.filterOngoing;
      document.getElementById('filter-parking').innerText = t.filterParking;
      document.getElementById('filter-work').innerText = t.filterWork;
      document.getElementById('filter-commerce').innerText = t.filterCommerce;
      document.getElementById('ui-footer-note').innerText = t.footerNote;

      const btnKo = document.getElementById('btn-ko');
      const btnEn = document.getElementById('btn-en');
      if (currentLang === 'ko') {
        btnKo.className = "px-2 py-0.5 rounded bg-cyan-500 text-white transition";
        btnEn.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      } else {
        btnEn.className = "px-2 py-0.5 rounded bg-cyan-500 text-white transition";
        btnKo.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      }
    }

    function toggleExpand(id) {
      expandedId = expandedId === id ? null : id;
      renderFeed(currentFilter);
    }

    function renderFeed(filter = 'ALL') {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';
      const t = I18N[currentLang];

      let filtered = POSTS;
      if (filter === 'ONGOING') {
        filtered = POSTS.filter(item => item.isOngoing);
      } else if (filter !== 'ALL') {
        filtered = POSTS.filter(item => item.cardType === filter);
      }

      filtered.forEach(item => {
        const votedKey = `justice_voted_${item.id}`;
        const userVoted = localStorage.getItem(votedKey);
        const isExpanded = expandedId === item.id;
        const isNew = isNewItem(item);

        const outcomeTitle = item.isOngoing ? t.verdictTitleOngoing : t.verdictTitleResolved;
        const voteLabelUp = item.isOngoing ? t.voteOngoingGuilty : t.voteAwesome;
        const voteLabelDown = item.isOngoing ? t.voteOngoingFlee : t.voteWeak;

        const card = document.createElement('article');
        card.className = `border rounded-2xl overflow-hidden shadow-xl transition ${isExpanded ? 'bg-[#161b22] border-cyan-500/50' : 'bg-[#161b22]/80 border-slate-800 hover:border-slate-700'}`;

        card.innerHTML = `
          <!-- 요약 행 (탭하면 펼쳐짐) -->
          <div onclick="toggleExpand('${item.id}')" class="p-3 flex items-center justify-between gap-2 cursor-pointer select-none">
            <div class="flex items-center gap-2 min-w-0 pr-2">
              <span class="text-lg shrink-0">${item.avatar}</span>
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="font-bold text-slate-200 text-sm truncate">${item.target[currentLang]}</span>
                  ${isNew ? `<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-rose-500 text-white shrink-0 animate-pulse">${t.newBadge}</span>` : ''}
                </div>
                <div class="text-[11px] text-slate-400 truncate">${item.location[currentLang]} · ${item.categoryName[currentLang]}</div>
                <div class="text-[11px] text-cyan-300/90 truncate mt-0.5">→ ${item.realityStat[currentLang]}</div>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded border whitespace-nowrap ${item.statusColor}">
                ${item.statusBadge[currentLang]}
              </span>
              <span class="text-slate-500 text-xs transition-transform duration-200 ${isExpanded ? 'rotate-180 text-cyan-400' : ''}">▼</span>
            </div>
          </div>

          ${isExpanded ? `
          <!-- 펼침 영역 -->
          <div class="border-t border-slate-800/80">
            <!-- 보도/사건 사진 아카이브 -->
            <div class="relative w-full h-40 bg-slate-950 overflow-hidden border-b border-slate-800">
              <img src="${item.imageBeforeUrl}" alt="${item.title[currentLang]}" class="w-full h-full object-cover object-center filter grayscale contrast-110 hover:grayscale-0 transition duration-500" loading="lazy">
              <div class="absolute inset-0 bg-gradient-to-t from-[#161b22] via-transparent to-black/30"></div>
              <span class="absolute bottom-2 left-3 text-[10px] font-mono text-slate-300 bg-black/60 px-2 py-0.5 rounded backdrop-blur border border-white/10 truncate max-w-[85%]">
                📷 ${item.imageCaption[currentLang]}
              </span>
            </div>

            <!-- 카드 본문 -->
            <div class="p-4 space-y-3">
              <h2 class="text-base font-extrabold text-white leading-snug tracking-tight">
                ${item.title[currentLang]}
              </h2>

              <!-- 발단/만행 박스 -->
              <div class="bg-[#1c2128] border-l-4 border-rose-500/80 rounded-r-xl p-3 space-y-1 shadow-inner">
                <div class="text-[11px] text-rose-400 font-mono font-bold whitespace-nowrap">
                  ${t.incidentLabel}
                </div>
                <p class="text-xs sm:text-sm text-slate-300 leading-relaxed font-normal">
                  ${item.incidentDetail[currentLang]}
                </p>
              </div>

              <!-- 대비 화살표 -->
              <div class="relative flex py-0.5 items-center justify-center">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="flex-shrink mx-2 text-[10px] font-mono font-bold text-slate-400 bg-[#161b22] px-2 py-0.5 rounded border border-slate-800 whitespace-nowrap">
                  ${item.timelineLabel[currentLang]}
                </span>
                <div class="flex-grow border-t border-slate-800"></div>
              </div>

              <!-- 결과 박스 -->
              <div class="bg-[#0e1117] border border-slate-800 rounded-xl p-3 space-y-1">
                <div class="flex items-center justify-between text-[11px] font-bold text-cyan-400 whitespace-nowrap">
                  <span>${outcomeTitle}</span>
                  <span class="text-[10px] text-slate-400 font-mono truncate ml-2">${item.realityStat[currentLang]}</span>
                </div>
                <p class="text-xs text-slate-300 leading-relaxed font-medium">
                  ${item.verdictDetail[currentLang]}
                </p>
                ${item.sourceRef ? `<p class="text-[10px] text-slate-500 font-mono pt-1 border-t border-slate-800/60">📰 ${item.sourceRef[currentLang]}</p>` : ''}
              </div>

              <!-- 실전 법적 대응 수칙 박스 -->
              <div class="bg-gradient-to-r from-cyan-950/20 to-blue-950/10 border border-cyan-500/20 rounded-xl p-2.5">
                <p class="text-xs text-cyan-200/90 leading-relaxed">
                  <strong class="text-cyan-400 font-extrabold mr-1 whitespace-nowrap">${t.takeawayTitle}</strong>${item.actionHighlight[currentLang]}
                </p>
              </div>
            </div>

            <!-- 1클릭 토글 인터랙션 바 -->
            <div class="px-4 py-2.5 bg-slate-900/60 border-t border-slate-800/80 flex items-center justify-between text-xs">
              <div class="flex items-center gap-2">
                <button onclick="event.stopPropagation(); toggleVote('${item.id}', 'up')" class="vote-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition whitespace-nowrap active:scale-95 ${userVoted === 'up' ? 'bg-cyan-600 border-cyan-500 text-white font-bold shadow-md shadow-cyan-500/30' : 'border-slate-700 bg-slate-800/80 text-slate-300 hover:border-cyan-500 hover:text-cyan-400'}">
                  <span>${voteLabelUp}</span>
                  <span class="font-mono font-bold">${item.upvotes + (userVoted === 'up' ? 1 : 0)}</span>
                </button>
                <button onclick="event.stopPropagation(); toggleVote('${item.id}', 'down')" class="vote-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition whitespace-nowrap active:scale-95 ${userVoted === 'down' ? 'bg-slate-700 border-slate-500 text-white font-bold' : 'border-slate-700 bg-slate-800/80 text-slate-400 hover:border-slate-500 hover:text-slate-200'}">
                  <span>${voteLabelDown}</span>
                  <span class="font-mono">${item.disagrees + (userVoted === 'down' ? 1 : 0)}</span>
                </button>
              </div>
              <span class="text-[11px] font-mono whitespace-nowrap ${userVoted ? 'text-cyan-400 font-bold' : 'text-slate-500'}">
                ${userVoted ? '✓ ' + t.votedBadge : ''}
              </span>
            </div>
          </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    function toggleVote(id, type) {
      const votedKey = `justice_voted_${id}`;
      const prev = localStorage.getItem(votedKey);

      if (prev === type) {
        localStorage.removeItem(votedKey);
      } else {
        localStorage.setItem(votedKey, type);
      }
      renderFeed(currentFilter);
    }

    function filterType(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "filter-btn active px-3 py-1 rounded-lg bg-cyan-500 text-white font-bold transition";
        } else {
          btn.className = "filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
        }
      });
      renderFeed(type);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('user_lang', lang);
      document.documentElement.lang = lang;
      updateUiLabels();
      renderFeed(currentFilter);
    }

    const savedLang = localStorage.getItem('user_lang');
    if (savedLang) {
      currentLang = savedLang;
    } else if (!navigator.language.startsWith('ko')) {
      currentLang = 'en';
    }

    document.documentElement.lang = currentLang;
    updateUiLabels();

    fetch('./posts.json')
      .then(res => res.json())
      .then(data => {
        POSTS = [...data.posts].reverse();
        renderFeed(currentFilter);
      })
      .catch(err => {
        console.error('Failed to load posts.json', err);
        document.getElementById('feed-container').innerHTML =
          `<p class="text-center text-slate-500 py-10 text-sm">${I18N[currentLang].loadError}</p>`;
      });
  </script>
</body>
</html>
