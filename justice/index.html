        disagrees: 11
      },
      // 5. [종결 3] 중고거래 생수병 사기범
      {
        id: "j3",
        cardType: "COMMERCE",
        isOngoing: false,
        categoryName: { ko: "중고 사기", en: "Secondhand Fraud" },
        statusBadge: { ko: "빨간줄 참교육 ✓", en: "Criminal Record ✓" },
        statusColor: "bg-rose-500/10 text-rose-400 border-rose-500/20",
        target: { ko: "생수병 배송 상습 사기범", en: "Secondhand Water Bottle Scammer" },
        location: { ko: "온라인 중고 플랫폼", en: "Peer-to-Peer Marketplace" },
        avatar: "📦",
        imageBeforeUrl: "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=800&auto=format&fit=crop&q=80",
        imageCaption: { ko: "중고 거래 허위 배송 포장 증거물", en: "Fraudulent package & tracking receipt" },
        title: {
          ko: "아이패드 판다더니 생수병 넣고 배째라던 20대 사기꾼의 최후",
          en: "Shipped bottled water instead of iPads, mocked victims until the arrest"
        },
        incidentDetail: {
          ko: "중고 플랫폼에서 전자기기 대금을 선입금받고 박스 안에 생수병과 쓰레기를 넣어 택배 발송. 구매자가 항의하자 '잡을 테면 잡아봐라, 초범이라 벌금 몇 십 나온다'며 능글맞게 조롱.",
          en: "Collected payments upfront and shipped bottled water in heavy boxes. Mocked victims: 'Try suing me, first offense is just a minor fine!'"
        },
        timelineLabel: { ko: "⏳ 피해자 단톡방 연대 및 병합 수사", en: "⏳ Victims United & Account Frozen" },
        realityStat: { ko: "피해액 전액 배상 명령 + 징역 10개월 실형", en: "Full Restitution Ordered + 10 Months Prison Time" },
        verdictDetail: {
          ko: "피해자들이 단톡방을 만들어 계좌 정보를 '더치트'에 등록하고, 각 관할 경찰서에 피해 사건을 병합 수사 의뢰. 단순 사기가 아닌 '상습 사기'로 죄명이 바뀌며 영장 실질심사 후 구속 수감됨.",
          en: "Victims networked via chat, coordinated filings across police jurisdictions, and merged cases into habitual fraud. The scammer was denied bail and sentenced to 10 months in prison."
        },
        actionHighlight: {
          ko: "소액 사기범은 '피해자가 귀찮아서 안 잡겠지'를 악용합니다. 더치트 등록 후 피해자들과 단톡방을 만들어 사건 번호를 병합(병합수사 촉구)하면 상습사기죄로 실형 구속 수사가 가능해집니다.",
          en: "Small-time scammers prey on apathy. Coordinating with fellow victims to combine police case numbers elevates charges to habitual fraud, leading directly to detention."
        },
        upvotes: 645,
        disagrees: 15
      }
    ];

    function updateUiLabels() {
      const t = I18N[currentLang];
      document.getElementById('ui-subname').innerText = t.subname;
      document.getElementById('ui-subtag').innerText = t.subtag;
      document.getElementById('ui-subtitle').innerText = t.subtitle;
      document.getElementById('ui-home').innerText = t.home;
      document.getElementById('filter-all').innerText = t.filterAll;
      document.getElementById('filter-ongoing').innerText = t.filterOngoing;
      document.getElementById('filter-parking').innerText = t.filterParking;
      document.getElementById('filter-work').innerText = t.filterWork;
      document.getElementById('filter-commerce').innerText = t.filterCommerce;
      document.getElementById('ui-footer-note').innerText = t.footerNote;

      const btnKo = document.getElementById('btn-ko');
      const btnEn = document.getElementById('btn-en');
      if (currentLang === 'ko') {
        btnKo.className = "px-2 py-0.5 rounded bg-cyan-500 text-white transition";
        btnEn.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      } else {
        btnEn.className = "px-2 py-0.5 rounded bg-cyan-500 text-white transition";
        btnKo.className = "px-2 py-0.5 rounded text-slate-400 hover:text-white transition";
      }
    }

    function renderFeed(filter = 'ALL') {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';
      const t = I18N[currentLang];

      let filtered = POSTS;
      if (filter === 'ONGOING') {
        filtered = POSTS.filter(item => item.isOngoing);
      } else if (filter !== 'ALL') {
        filtered = POSTS.filter(item => item.cardType === filter);
      }

      filtered.forEach(item => {
        const votedKey = `justice_voted_${item.id}`;
        const userVoted = localStorage.getItem(votedKey);

        const outcomeTitle = item.isOngoing ? t.verdictTitleOngoing : t.verdictTitleResolved;
        const voteLabelUp = item.isOngoing ? t.voteOngoingGuilty : t.voteAwesome;
        const voteLabelDown = item.isOngoing ? t.voteOngoingFlee : t.voteWeak;

        const card = document.createElement('article');
        card.className = "bg-[#161b22] border border-slate-800 rounded-2xl overflow-hidden shadow-xl";

        card.innerHTML = `
          <!-- 1. 헤더 -->
          <div class="p-3 pb-2 flex items-center justify-between border-b border-slate-800/60 bg-slate-900/40 text-xs">
            <div class="flex items-center gap-1.5 min-w-0 pr-2">
              <span class="text-base shrink-0">${item.avatar}</span>
              <div class="truncate">
                <span class="font-bold text-slate-200">${item.target[currentLang]}</span>
                <span class="text-[11px] text-slate-400">· ${item.location[currentLang]}</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0 whitespace-nowrap">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${item.statusColor}">
                ${item.statusBadge[currentLang]}
              </span>
              <span class="text-[10px] font-mono text-slate-400">${item.categoryName[currentLang]}</span>
            </div>
          </div>

          <!-- 2. 보도/사건 사진 아카이브 -->
          <div class="relative w-full h-40 bg-slate-950 overflow-hidden border-b border-slate-800">
            <img src="${item.imageBeforeUrl}" alt="${item.title[currentLang]}" class="w-full h-full object-cover object-center filter grayscale contrast-110 hover:grayscale-0 transition duration-500" loading="lazy">
            <div class="absolute inset-0 bg-gradient-to-t from-[#161b22] via-transparent to-black/30"></div>
            <span class="absolute bottom-2 left-3 text-[10px] font-mono text-slate-300 bg-black/60 px-2 py-0.5 rounded backdrop-blur border border-white/10 truncate max-w-[85%]">
              📷 ${item.imageCaption[currentLang]}
            </span>
          </div>

          <!-- 3. 카드 본문 -->
          <div class="p-4 space-y-3">
            <h2 class="text-base font-extrabold text-white leading-snug tracking-tight">
              ${item.title[currentLang]}
            </h2>

            <!-- 발단/만행 박스 -->
            <div class="bg-[#1c2128] border-l-4 border-rose-500/80 rounded-r-xl p-3 space-y-1 shadow-inner">
              <div class="text-[11px] text-rose-400 font-mono font-bold whitespace-nowrap">
                ${t.incidentLabel}
              </div>
              <p class="text-xs sm:text-sm text-slate-300 leading-relaxed font-normal">
                ${item.incidentDetail[currentLang]}
              </p>
            </div>

            <!-- 대비 화살표 -->
            <div class="relative flex py-0.5 items-center justify-center">
              <div class="flex-grow border-t border-slate-800"></div>
              <span class="flex-shrink mx-2 text-[10px] font-mono font-bold text-slate-400 bg-[#161b22] px-2 py-0.5 rounded border border-slate-800 whitespace-nowrap">
                ${item.timelineLabel[currentLang]}
              </span>
              <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <!-- 결과 박스 -->
            <div class="bg-[#0e1117] border border-slate-800 rounded-xl p-3 space-y-1">
              <div class="flex items-center justify-between text-[11px] font-bold text-cyan-400 whitespace-nowrap">
                <span>${outcomeTitle}</span>
                <span class="text-[10px] text-slate-400 font-mono truncate ml-2">${item.realityStat[currentLang]}</span>
              </div>
              <p class="text-xs text-slate-300 leading-relaxed font-medium">
                ${item.verdictDetail[currentLang]}
              </p>
            </div>

            <!-- 실전 법적 대응 수칙 박스 -->
            <div class="bg-gradient-to-r from-cyan-950/20 to-blue-950/10 border border-cyan-500/20 rounded-xl p-2.5">
              <p class="text-xs text-cyan-200/90 leading-relaxed">
                <strong class="text-cyan-400 font-extrabold mr-1 whitespace-nowrap">${t.takeawayTitle}</strong>${item.actionHighlight[currentLang]}
              </p>
            </div>
          </div>

          <!-- 4. 1클릭 토글 인터랙션 바 -->
          <div class="px-4 py-2.5 bg-slate-900/60 border-t border-slate-800/80 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
              <button onclick="toggleVote('${item.id}', 'up')" class="vote-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition whitespace-nowrap active:scale-95 ${userVoted === 'up' ? 'bg-cyan-600 border-cyan-500 text-white font-bold shadow-md shadow-cyan-500/30' : 'border-slate-700 bg-slate-800/80 text-slate-300 hover:border-cyan-500 hover:text-cyan-400'}">
                <span>${voteLabelUp}</span>
                <span class="font-mono font-bold">${item.upvotes + (userVoted === 'up' ? 1 : 0)}</span>
              </button>
              <button onclick="toggleVote('${item.id}', 'down')" class="vote-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition whitespace-nowrap active:scale-95 ${userVoted === 'down' ? 'bg-slate-700 border-slate-500 text-white font-bold' : 'border-slate-700 bg-slate-800/80 text-slate-400 hover:border-slate-500 hover:text-slate-200'}">
                <span>${voteLabelDown}</span>
                <span class="font-mono">${item.disagrees + (userVoted === 'down' ? 1 : 0)}</span>
              </button>
            </div>
            <span class="text-[11px] font-mono whitespace-nowrap ${userVoted ? 'text-cyan-400 font-bold' : 'text-slate-500'}">
              ${userVoted ? '✓ ' + t.votedBadge : ''}
            </span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleVote(id, type) {
      const votedKey = `justice_voted_${id}`;
      const prev = localStorage.getItem(votedKey);

      if (prev === type) {
        localStorage.removeItem(votedKey);
      } else {
        localStorage.setItem(votedKey, type);
      }
      renderFeed(currentFilter);
    }

    function filterType(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = "filter-btn active px-3 py-1 rounded-lg bg-cyan-500 text-white font-bold transition";
        } else {
          btn.className = "filter-btn px-3 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
        }
      });
      renderFeed(type);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('user_lang', lang);
      document.documentElement.lang = lang;
      updateUiLabels();
      renderFeed(currentFilter);
    }

    const savedLang = localStorage.getItem('user_lang');
    if (savedLang) {
      currentLang = savedLang;
    } else if (!navigator.language.startsWith('ko')) {
      currentLang = 'en';
    }

    document.documentElement.lang = currentLang;
    updateUiLabels();
    renderFeed();
  </script>
</body>
</html>
